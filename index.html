<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Telefoonboek</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Telefoonboek">
<meta name="theme-color" content="#16120F">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  /* warm leer en zellige in plaats van alles blauw */
  --night:#16120F; --surface:#211B16; --surface2:#2C2419; --line:#3C3227;
  --sand:#F4ECE0; --dim:#A8998A;
  --mint:#4FC08D;      /* jouw eigen cijfers */
  --azure:#D9744C;     /* samen, en alle knoppen: terracotta */
  --saffron:#E7AE45;   /* geld dat nog moet komen */
  --clay:#B8483A;      /* weg / fout */
  --teal:#4E9E96;      /* op voorraad */
  --sky:#6C8FD8;       /* verstuurd, onderweg naar Marokko */
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI Variable','Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--night);color:var(--sand);font-family:var(--sans);
  font-size:16px;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.dim{color:var(--dim)}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--azure);outline-offset:2px}
input,select,textarea{font-family:inherit;font-size:16px}
.lock{opacity:.65;margin-left:5px;vertical-align:-1px}

.wrap{max-width:480px;margin:0 auto;padding-bottom:124px}

/* ── kop ── */
.top{position:sticky;top:0;z-index:20;background:var(--night);padding-top:env(safe-area-inset-top)}
.top-in{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:18px 18px 0}
.title{font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.sub{font-size:12px;color:var(--dim);margin-top:3px;letter-spacing:.02em}
.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:10px;
  display:flex;align-items:center;justify-content:center}
.board{display:flex;align-items:baseline;justify-content:space-between;width:100%;padding:14px 18px 12px;font-size:13px}
.board b{color:var(--saffron);font-family:var(--mono);font-weight:600;font-size:15px;letter-spacing:-.01em}
.zellige{height:8px;
  background-image:linear-gradient(45deg,var(--line) 25%,transparent 25%,transparent 75%,var(--line) 75%),
                   linear-gradient(45deg,var(--line) 25%,transparent 25%,transparent 75%,var(--line) 75%);
  background-size:8px 8px;background-position:0 0,4px 4px;opacity:.75}

.pad{padding:0 18px}

/* ── cijfers bovenaan ── */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px 14px;
  display:block;width:100%;text-align:left}
.stat .k{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--dim)}
.stat .v{font-family:var(--mono);font-size:21px;font-weight:600;margin-top:8px;letter-spacing:-.03em;word-break:break-all}
.stat .s{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:3px}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--dim);margin-top:10px;padding:0 3px}

/* ── de balk voor samen ── */
.band{position:relative;overflow:hidden;background:linear-gradient(150deg,var(--surface2),var(--surface));
  border:1px solid var(--azure);border-radius:18px;padding:16px;margin-top:12px}
.band:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--azure)}
.band .k{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--azure);font-weight:600}
.band .v{font-family:var(--mono);font-size:24px;font-weight:600;margin-top:8px;letter-spacing:-.03em}
.band .s{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:4px;line-height:1.5}
.band .go{width:100%;margin-top:14px;background:var(--azure);color:#1B1108;border-radius:12px;padding:13px;
  font-size:14px;font-weight:700;letter-spacing:.01em}

/* ── tabbladen ── */
.tabswrap{position:relative;margin-top:22px}
/* een vage rand rechts, zodat je ziet dat er nog tabbladen achter zitten */
.tabswrap.meer:after{content:'';position:absolute;right:2px;top:2px;bottom:2px;width:40px;pointer-events:none;
  border-radius:0 12px 12px 0;background:linear-gradient(to right,rgba(33,27,22,0),var(--surface))}
.tabs{display:flex;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border-radius:10px;padding:9px 11px;font-size:12.5px;font-weight:600;color:var(--dim);letter-spacing:-.01em;white-space:nowrap}
.tab.on{background:var(--sand);color:var(--night)}
.search{width:100%;margin-top:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:13px;padding:11px 14px;color:var(--sand);font-size:14px}

/* ── kaart ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px;
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset;animation:rise .24s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.chead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.cname{font-size:17px;font-weight:650;line-height:1.2;letter-spacing:-.02em}
.cmeta{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.4}
.pill{flex:0 0 auto;border-radius:999px;padding:6px 12px;font-size:11px;font-weight:700;white-space:nowrap;
  text-transform:uppercase;letter-spacing:.06em}
.pill.sold{background:var(--mint);color:#0C2119;border:1px solid var(--mint)}
.pill.stock{background:transparent;color:var(--teal);border:1px solid var(--teal)}
.pill.client{background:var(--saffron);color:#241804;border:1px solid var(--saffron)}
.pill.sent{background:var(--sky);color:#0B1226;border:1px solid var(--sky)}
.pill.off{background:transparent;color:var(--clay);border:1px solid var(--clay)}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:14px;margin-top:8px}
.row .r{font-family:var(--mono);text-align:right;letter-spacing:-.01em}
.win{border-top:1px solid var(--line);padding-top:11px;margin-top:12px}
.floor{background:var(--night);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-top:14px}
.floor b{font-family:var(--mono);letter-spacing:-.02em;font-size:15px}
.dl{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  border-bottom:1px solid var(--line);padding:12px 0}
.dl .nm{font-size:14px;font-weight:600;letter-spacing:-.01em}
.dl .dsub{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.45}
.dl .val{font-family:var(--mono);text-align:right;white-space:nowrap;font-size:14px}
.dl .val .s{display:block;font-size:11px;color:var(--dim);margin-top:3px}
.tot{display:flex;justify-content:space-between;gap:12px;margin-top:13px;padding-top:12px;
  border-top:1px solid var(--line);font-weight:650;font-size:14px}
.tot .mono{font-size:15px}
.tot.eind{border-top:2px solid var(--azure);margin-top:20px}
.win b{font-family:var(--mono);letter-spacing:-.02em;font-size:15px}

/* ── klant en betaling ── */
.box{background:var(--night);border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:14px}
.tiles{display:flex;gap:4px;margin-top:10px}
.tile{flex:1;height:9px;border-radius:3px;background:var(--line);transition:background .2s}
.plist{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.pay{display:flex;align-items:center;justify-content:space-between;font-size:12px}
.pay .x{padding:2px 6px;color:var(--dim)}
.mini{display:flex;gap:8px;margin-top:12px}
.mini input{flex:1;min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:10px;
  padding:10px;color:var(--sand);font-family:var(--mono);font-size:14px}
.mini .ok{background:var(--mint);color:#0C2119;border-radius:10px;padding:0 15px;font-weight:700}
.mini .no{border:1px solid var(--line);border-radius:10px;padding:0 13px;color:var(--dim)}
.ghost{width:100%;margin-top:12px;border:1px solid var(--teal);color:var(--teal);border-radius:10px;
  padding:10px;font-size:14px;font-weight:600;background:transparent}
.cact{display:flex;justify-content:flex-end;align-items:center;gap:2px;margin-top:14px;
  border-top:1px solid var(--line);padding-top:8px}
.cact button{font-size:12px;color:var(--dim);padding:8px 10px;border-radius:9px;font-weight:500}
.cact .danger{background:var(--clay);color:var(--sand);font-weight:700}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:26px;text-align:center;margin-top:12px}
.empty b{display:block;font-weight:650}
.empty span{display:block;font-size:14px;color:var(--dim);margin-top:7px}

/* ── onderbalk ── */
/* Geen backdrop-filter op een vaste balk: tijdens het scrollen op een telefoon
   tekent de browser hem dan te laat en schuift hij mee met de bladzijde.
   Een eigen laag (translateZ) houdt hem op zijn plek. */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--night);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
  transform:translateZ(0);-webkit-backface-visibility:hidden}
.bar-in{max-width:480px;margin:0 auto;padding:12px 18px 16px}
.bar-in.two{display:flex;gap:8px}
.bar-in.two .primary{flex:1}
.bar-in.two .second{flex:0 0 auto;border:1px solid var(--line);color:var(--sand);border-radius:13px;
  padding:14px 16px;font-size:15px;font-weight:600}
.primary{width:100%;background:var(--azure);color:#1B1108;border-radius:13px;padding:14px;
  font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}

/* ── schermen ── */
.sheet{position:fixed;inset:0;z-index:40;background:var(--night);overflow-y:auto;padding-top:env(safe-area-inset-top)}
.sheet-in{max-width:480px;margin:0 auto;padding:0 18px 150px}
.shead{position:sticky;top:0;background:var(--night);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:15px 0;margin:0 -18px;padding-left:18px;z-index:5}
.shead .t{font-size:18px;font-weight:650;letter-spacing:-.02em}
.back{font-size:24px;line-height:1;padding:2px 8px}
.label{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--dim);margin:22px 0 8px}
.in{width:100%;background:var(--night);border:1px solid var(--line);border-radius:13px;padding:13px;color:var(--sand)}
.in.mono{font-family:var(--mono)}
select.in{appearance:none;-webkit-appearance:none;background-image:none}
.selwrap{position:relative}
.selwrap:after{content:'▾';position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--dim);
  font-size:12px;pointer-events:none}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair .cap{font-size:11px;color:var(--dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.1em}
.hint{font-size:12px;color:var(--dim);margin-top:7px;line-height:1.5}
.seg{display:flex;gap:4px;background:var(--night);border:1px solid var(--line);border-radius:13px;padding:4px}
.seg button{flex:1;border-radius:10px;padding:11px;font-size:14px;font-weight:600;color:var(--dim)}
.seg button.on-stock{background:var(--teal);color:#08201E}
.seg button.on-sold{background:var(--mint);color:#0C2119}
.seg button.on-sent{background:var(--sky);color:#0B1226}
.seg.three button{font-size:13px;padding:11px 4px;white-space:nowrap}
.seg button.on-off{background:var(--clay);color:#FDEEEC}
.seg.four{flex-wrap:wrap}
.seg.four button{flex:1 1 44%;font-size:13px;padding:11px 4px;white-space:nowrap}
.soldbox{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:4px 15px 18px;margin-top:12px}
.soldbox .label{margin-top:16px}
.profit{font-family:var(--mono);font-size:14px;margin-top:11px;line-height:1.7}
.sbar{position:fixed;left:0;right:0;bottom:0;background:var(--night);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
  transform:translateZ(0);-webkit-backface-visibility:hidden}
.sbar-in{max-width:480px;margin:0 auto;display:flex;gap:8px;padding:12px 18px 16px}
.sbar .cancel{border:1px solid var(--line);color:var(--dim);border-radius:13px;padding:14px 18px;font-size:14px;font-weight:600}
.sbar .save{flex:1;background:var(--azure);color:#1B1108;border-radius:13px;padding:14px;font-size:15px;font-weight:700}
.outline{width:100%;border:1px solid var(--azure);color:var(--azure);border-radius:13px;padding:12px;
  font-size:14px;font-weight:600;margin-top:10px;background:transparent}
.outline.quiet{border-color:var(--line);color:var(--sand)}
.divider{border-top:1px solid var(--line);margin-top:26px}
.note{font-size:12px;color:var(--dim);margin-top:11px;line-height:1.55}
.tip{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:16px;
  font-size:13px;line-height:1.55}
.tip .close{float:right;color:var(--dim);padding:0 0 8px 12px}
.tips{margin-top:10px}
.tips ul{margin:8px 0 0;padding-left:18px}
.tips li{font-size:13px;color:var(--dim);line-height:1.6;margin-bottom:4px}
.warn{background:#2E1A14;border:1px solid var(--clay);border-radius:13px;padding:13px;margin-top:12px;font-size:14px;line-height:1.5}
.warn .x{float:right;color:var(--dim);padding:0 0 10px 14px;font-size:18px;line-height:1}
.warn .go{width:100%;margin-top:12px;background:var(--azure);color:#1B1108;border-radius:12px;
  padding:12px;font-weight:700;font-size:14px}
.metabtn{color:var(--azure);font-weight:600;font-size:12px;padding:0;text-align:right}
.sortrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px;padding:0 3px}
.sortrow .k{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--dim);margin-right:2px}
.sortbtn{color:var(--dim);font-size:12px;font-weight:600;padding:6px 11px;
  border:1px solid var(--line);border-radius:999px;white-space:nowrap}
.sortbtn.on{color:var(--night);background:var(--sand);border-color:var(--sand)}
.oudecheck{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;
  background:var(--surface);border:1px solid var(--saffron);border-radius:14px;padding:13px;font-size:14px}
.oudecheck button{flex:0 0 auto;border:1px solid var(--saffron);color:var(--saffron);border-radius:11px;
  padding:9px 12px;font-weight:600;font-size:13px}
.fotorij{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.fototh{width:62px;height:62px;border-radius:12px;overflow:hidden;border:1px solid var(--line);
  padding:0;background:var(--night)}
.fototh img{width:100%;height:100%;object-fit:cover;display:block}
.fotoadd{width:62px;height:62px;border-radius:12px;border:1px dashed var(--line);
  color:var(--dim);font-size:11px;font-weight:600;line-height:1.3}
.fotoact{align-self:center;border:1px solid var(--line);border-radius:999px;padding:8px 13px;
  color:var(--dim);font-size:12px;font-weight:600;white-space:nowrap}
.fotoview{position:fixed;inset:0;z-index:60;background:#0B0908;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.fotoview img{flex:1;min-height:0;width:100%;object-fit:contain}
.fotoview .sluit{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 10px);z-index:2;
  width:38px;height:38px;border-radius:999px;background:rgba(0,0,0,.55);color:#F4ECE0;font-size:22px;line-height:1}
.fotobar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;font-size:13px}
.fotobar button{padding:9px 12px;border-radius:10px;border:1px solid var(--line);color:var(--sand);
  font-weight:600;font-size:13px;margin-left:7px}
.fotobar .danger{border-color:var(--clay);color:var(--clay)}
.zbtn{width:100%;margin-top:12px;border:1px solid var(--sky);color:var(--sky);border-radius:12px;
  padding:11px;font-weight:600;font-size:14px}
button.dl{width:100%;text-align:left}
.dl .tik{color:var(--sky);font-weight:700;margin-right:5px}

/* ── kosten, codes, vinkjes ── */
.costrow{display:flex;align-items:center;gap:8px;margin-top:8px}
.partrow{background:var(--night);border:1px solid var(--line);border-radius:14px;padding:11px;margin-top:9px}
.partrow .op{display:flex;align-items:center;gap:8px;margin-top:8px}
.partrow .op input{flex:1;min-width:0}
.partrow .weg{flex:0 0 auto;width:38px;height:38px;border:1px solid var(--line);border-radius:10px;
  color:var(--dim);font-size:18px;line-height:1}
.partadd{width:100%;margin-top:10px;border:1px dashed var(--line);color:var(--sand);border-radius:12px;
  padding:12px;font-weight:600;font-size:14px}
.clab{flex:0 0 92px;font-size:13px;color:var(--dim)}
.costrow input{flex:1;min-width:0}
.cur{display:flex;gap:3px;background:var(--night);border:1px solid var(--line);border-radius:10px;padding:3px}
.cur button{padding:7px 10px;border-radius:8px;font-size:13px;font-weight:700;color:var(--dim);font-family:var(--mono)}
.cur button.on{background:var(--sand);color:var(--night)}
.segsm{display:flex;gap:6px;margin-top:12px}
.segsm button{flex:1;border-radius:11px;padding:11px;font-size:14px;font-weight:600;border:1px solid var(--azure);
  color:var(--azure);background:transparent}
.segsm button.on{background:var(--azure);color:#1B1108}
.grp{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--azure);margin:26px 0 4px;font-weight:600}
.code{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:13px;
  padding:13px;margin-top:8px;display:block}
.code b{font-family:var(--mono);font-size:15px;color:var(--saffron);display:block;letter-spacing:.02em}
.code span{display:block;font-size:13px;color:var(--dim);margin-top:6px;line-height:1.5}
.chk{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 0;
  border-bottom:1px solid var(--line);font-size:14px;line-height:1.45}
.chk .b{flex:0 0 auto;width:23px;height:23px;border-radius:8px;border:1px solid var(--line);display:flex;
  align-items:center;justify-content:center;font-size:13px;font-weight:700;color:transparent;margin-top:1px}
.chk.on .b{background:var(--mint);border-color:var(--mint);color:#0C2119}
.chk.on .t{color:var(--dim);text-decoration:line-through}
.count{font-family:var(--mono);font-size:13px;color:var(--dim);margin-top:16px}
.pre{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px;
  font-family:var(--mono);font-size:12px;line-height:1.7;white-space:pre-wrap;word-break:break-word;
  max-height:46vh;overflow:auto;margin-top:12px}
.ver{font-size:11px;color:var(--dim);text-align:center;margin-top:26px}

/* ── slot ── */
.lockscreen{position:fixed;inset:0;z-index:60;background:var(--night);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:32px 24px calc(32px + env(safe-area-inset-bottom))}
.lockscreen .lg{font-size:26px;font-weight:700;letter-spacing:-.02em}
.lockscreen .ls{font-size:13px;color:var(--dim);margin-top:8px;text-align:center;line-height:1.5}
.dots{display:flex;gap:14px;margin:32px 0 8px;height:16px;align-items:center}
.dot{width:13px;height:13px;border-radius:50%;border:1px solid var(--line);transition:all .15s}
.dot.on{background:var(--azure);border-color:var(--azure);transform:scale(1.1)}

<script>
/* ── data ── */
var KEY='telefoonboek_v1';
var CATALOG={
 'iPhone':['11','11 Pro','11 Pro Max','SE (2020)','12 mini','12','12 Pro','12 Pro Max','13 mini','13','13 Pro','13 Pro Max','SE (2022)','14','14 Plus','14 Pro','14 Pro Max','15','15 Plus','15 Pro','15 Pro Max','16e','16','16 Plus','16 Pro','16 Pro Max'],
 'Samsung':['Galaxy S21','Galaxy S21+','Galaxy S21 Ultra','Galaxy S21 FE','Galaxy S22','Galaxy S22+','Galaxy S22 Ultra','Galaxy S23','Galaxy S23 FE','Galaxy S23+','Galaxy S23 Ultra','Galaxy S24','Galaxy S24 FE','Galaxy S24+','Galaxy S24 Ultra','Galaxy S25','Galaxy S25+','Galaxy S25 Ultra','Galaxy Z Flip 3','Galaxy Z Flip 4','Galaxy Z Flip 5','Galaxy Z Flip 6','Galaxy Z Fold 3','Galaxy Z Fold 4','Galaxy Z Fold 5','Galaxy Z Fold 6','Galaxy Note 20','Galaxy Note 20 Ultra','Galaxy A15','Galaxy A25','Galaxy A34','Galaxy A35','Galaxy A54','Galaxy A55','Galaxy A56'],

/* Het versienummer staat hier, en verder alleen nog in sw.js. Verhoog beide,
   anders ziet de app zijn eigen wijziging niet. */
var VERSIE='20', VERSIEDATUM='september 2026';

var S={rate:10.3,items:[],checks:{},checkBrand:'iPhone',checkAt:'',pin:'',hide:false,snaps:[],zendingen:[]};
var ui={tab:'all',q:'',payFor:null,payCur:'',payVal:'',confirmDel:null,msg:'',tipOff:false,lang:'ar',tips:false,bkOff:false,sort:'nieuw',zdel:''};

function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){
      var d=JSON.parse(raw);
      if(d.rate)S.rate=d.rate;
      if(Array.isArray(d.items))S.items=d.items;
      if(d.checks)S.checks=d.checks;
      if(d.checkBrand)S.checkBrand=d.checkBrand;
      if(d.checkAt)S.checkAt=d.checkAt;
      if(d.lang)ui.lang=d.lang;
      if(d.lastBackup)S.lastBackup=d.lastBackup;
      if(d.lastFoto)S.lastFoto=d.lastFoto;
      if(d.pin)S.pin=d.pin;
      if(d.hide)S.hide=d.hide;
      if(Array.isArray(d.snaps))S.snaps=d.snaps;
      if(Array.isArray(d.zendingen))S.zendingen=d.zendingen;
    }
    ui.tipOff=localStorage.getItem(KEY+'_tip')==='1';
  }catch(e){}
}
/* Voordat er iets verandert: bewaar de stand die er nu staat als herstelpunt.
   Eén per dag, maximaal vijf. Zo kun je altijd terug zonder met bestanden te
   hoeven slepen. Let op: dit staat op dit toestel — het vervangt een echte
   back-up niet als je je telefoon kwijtraakt. */
function snapshotBij(altijd){
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw)return;
    var d=JSON.parse(raw);
    if(!d||!Array.isArray(d.items)||!d.items.length)return;
    S.snaps=S.snaps||[];
    var dag=today();
    if(!altijd && S.snaps.length && S.snaps[0].dag===dag) return;
    S.snaps.unshift({dag:dag, at:Date.now(), n:d.items.length,
      data:JSON.stringify({v:1,rate:d.rate,items:d.items,zendingen:d.zendingen})});
    S.snaps=S.snaps.slice(0,5);
  }catch(e){}
}

function save(){
  snapshotBij(false);
  for(var poging=0;poging<4;poging++){
    try{
      localStorage.setItem(KEY,JSON.stringify({v:1,rate:S.rate,items:S.items,checks:S.checks,
        checkBrand:S.checkBrand,checkAt:S.checkAt,lang:ui.lang,lastBackup:S.lastBackup,lastFoto:S.lastFoto,
        pin:S.pin,hide:S.hide,snaps:S.snaps,zendingen:S.zendingen}));
      ui.msg='';return true;
    }catch(e){
      /* Geen ruimte? Dan gaan de oudste herstelpunten eraf; je eigen boek gaat voor. */
      if(S.snaps&&S.snaps.length){S.snaps.pop();continue;}
      ui.msg='Opslaan lukte niet. Maak ruimte vrij op je telefoon of maak eerst een back-up.';
      return false;
    }
  }
  return false;
}

/* ── rekenen en tonen ── */
function uid(){return Math.random().toString(36).slice(2,10)}
function num(v){if(typeof v==='number')return isFinite(v)?v:0;var n=parseFloat(String(v==null?'':v).replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:0}
function eur(n){return '€ '+(n||0).toLocaleString('nl-NL',{minimumFractionDigits:2,maximumFractionDigits:2})}
function mad(n){return (n||0).toLocaleString('nl-NL',{maximumFractionDigits:0})+' DH'}
function toEUR(a,cur){return cur==='MAD'?num(a)/(S.rate||1):num(a)}
function toMAD(a,cur){return cur==='MAD'?num(a):num(a)*(S.rate||1)}
function today(){return new Date().toISOString().slice(0,10)}
function dateNL(s){if(!s)return '';var d=new Date(s);if(isNaN(d))return '';return d.toLocaleDateString('nl-NL',{day:'numeric',month:'short',year:'numeric'})}
/* ── de koers die bij een toestel hoort ──
   Zolang een toestel nog niet verkocht is rekent de app met de koers van nu.
   Zodra je verkoopt wordt de koers van die dag bij het toestel bewaard, zodat
   je winst van vorige maanden niet meer verschuift als je de koers aanpast. */
function kr(it){var r=num(it&&it.rate);return r>0?r:S.rate}
function toEURk(it,a,cur){return cur==='MAD'?num(a)/(kr(it)||1):num(a)}
function toMADk(it,a,cur){return cur==='MAD'?num(a):num(a)*kr(it)}

function paidEUR(it){return (it.payments||[]).reduce(function(s,p){return s+toEURk(it,p.amount,p.cur)},0)}
/* wat de klant echt nog moet betalen, in dirham, zonder omrekenen heen en terug */
function paidMAD(it){var s2=0;(it.payments||[]).forEach(function(p){s2+=toMADk(it,p.amount,p.cur)});return s2}
function restMAD(it){return Math.max(0,toMADk(it,it.sell,it.sellCur)-paidMAD(it))}
/* privécijfer: verborgen als het oog uit staat */
function pv(s){return S.hide?'••••':s}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function comma(n,d){return n.toFixed(d).replace('.',',')}
function standalone(){
  try{
    if(window.navigator.standalone===true)return true;
    if(window.matchMedia)return window.matchMedia('(display-mode: standalone)').matches;
  }catch(e){}
  return false;
}

/* transport en onderdelen: alleen jouw kosten */
/* ── foto's ──
   Je boek staat in localStorage en die lade is maar zo'n 5 MB groot: daar past
   geen foto in. Foto's gaan daarom in IndexedDB, een tweede lade op je toestel
   die voor bestanden bedoeld is. Ze worden verkleind voordat ze erin gaan.
   Let op: ze passen niet in het back-upbestand, dat is tekst. */
var FOTO_MAX=4, FOTO_BREED=1400, FOTO_KWAL=0.72;
var FDB=null, fdbStuk=false, fotoDoel='', fotoUrls={};

function fotoDB(cb){
  if(FDB){cb(FDB);return}
  if(fdbStuk||!window.indexedDB){cb(null);return}
  try{
    var req=indexedDB.open('telefoonboek-fotos',1);
    req.onupgradeneeded=function(e){
      var db=e.target.result;
      if(!db.objectStoreNames.contains('fotos')){
        var st=db.createObjectStore('fotos',{keyPath:'id'});
        st.createIndex('itemId','itemId',{unique:false});
      }
    };
    req.onsuccess=function(){FDB=req.result;cb(FDB)};
    req.onerror=function(){fdbStuk=true;cb(null)};
    req.onblocked=function(){fdbStuk=true;cb(null)};
  }catch(e){fdbStuk=true;cb(null)}
}

function fotosVan(itemId,cb){
  fotoDB(function(db){
    if(!db){cb([]);return}
    try{
      var ix=db.transaction('fotos','readonly').objectStore('fotos').index('itemId');
      var uit=[], cur=ix.openCursor(IDBKeyRange.only(itemId));
      cur.onsuccess=function(e){
        var c=e.target.result;
        if(c){uit.push(c.value);c.continue()}
        else{uit.sort(function(a,b){return (a.at||0)-(b.at||0)});cb(uit)}
      };
      cur.onerror=function(){cb([])};
    }catch(e){cb([])}
  });
}

function fotoOpslaan(itemId,blob,w,h,cb){
  fotoDB(function(db){
    if(!db){cb(false);return}
    try{
      var tx=db.transaction('fotos','readwrite');
      tx.objectStore('fotos').put({id:uid()+uid(),itemId:itemId,blob:blob,
        w:w||0,h:h||0,size:blob.size||0,at:Date.now()});
      tx.oncomplete=function(){cb(true)};
      tx.onerror=function(){cb(false)};
      tx.onabort=function(){cb(false)};
    }catch(e){cb(false)}
  });
}

function fotoWeg(fid,cb){
  fotoDB(function(db){
    if(!db){cb(false);return}
    try{
      var tx=db.transaction('fotos','readwrite');
      tx.objectStore('fotos').delete(fid);
      tx.oncomplete=function(){cb(true)};
      tx.onerror=function(){cb(false)};
    }catch(e){cb(false)}
  });
}

/* alle foto's van een toestel weg, als het toestel zelf wordt verwijderd */
function fotosWegVan(itemId,cb){
  fotosVan(itemId,function(rijen){
    if(!rijen.length){if(cb)cb();return}
    var klaar=0;
    rijen.forEach(function(r){
      fotoWeg(r.id,function(){klaar++;if(klaar===rijen.length&&cb)cb()});
    });
  });
}

function fotoTotalen(cb){
  fotoDB(function(db){
    if(!db){cb(0,0);return}
    try{
      var cur=db.transaction('fotos','readonly').objectStore('fotos').openCursor();
      var n=0, bytes=0;
      cur.onsuccess=function(e){
        var c=e.target.result;
        if(c){n++;bytes+=num(c.value.size)||0;c.continue()}
        else cb(n,bytes);
      };
      cur.onerror=function(){cb(0,0)};
    }catch(e){cb(0,0)}
  });
}

/* een foto uit de camera is 3 tot 5 MB; verkleind is hij er zo'n 200 KB */
function verkleinFoto(file,cb){
  var url='';
  try{
    url=URL.createObjectURL(file);
    var img=new Image();
    img.onload=function(){
      try{
        var w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        var f=Math.min(1,FOTO_BREED/Math.max(w||1,h||1));
        var nw=Math.max(1,Math.round((w||FOTO_BREED)*f)), nh=Math.max(1,Math.round((h||FOTO_BREED)*f));
        var cv=document.createElement('canvas');
        cv.width=nw; cv.height=nh;
        cv.getContext('2d').drawImage(img,0,0,nw,nh);
        URL.revokeObjectURL(url);
        if(cv.toBlob)cv.toBlob(function(bl){cb(bl||file,nw,nh)},'image/jpeg',FOTO_KWAL);
        else cb(file,w,h);
      }catch(e){try{URL.revokeObjectURL(url)}catch(e2){} cb(file,0,0)}
    };
    img.onerror=function(){try{URL.revokeObjectURL(url)}catch(e2){} cb(file,0,0)};
    img.src=url;
  }catch(e){cb(file,0,0)}
}

function fotoCacheWeg(itemId){
  var l=fotoUrls[itemId];
  if(l)l.forEach(function(x){try{URL.revokeObjectURL(x.url)}catch(e){}});
  delete fotoUrls[itemId];
}

/* de strook onder een kaart vullen; gebeurt na het tekenen, want de lade
   antwoordt niet meteen */
function vulFotos(itemId){
  var box=document.getElementById('fr_'+itemId);
  if(!box)return;
  function teken(lijst){
    var b=document.getElementById('fr_'+itemId);
    if(!b)return;
    var h='';
    lijst.forEach(function(f){
      h+='<button class="fototh" data-act="fotoview" data-id="'+itemId+'" data-f="'+f.id+'">'
       + '<img src="'+f.url+'" alt=""></button>';
    });
    if(lijst.length<FOTO_MAX)
      h+='<button class="fotoadd" data-act="fotoadd" data-id="'+itemId+'">+ foto</button>';
    if(lijst.length)
      h+='<button class="fotoact" data-act="fotoitem" data-id="'+itemId+'">'
       + (lijst.length===1?'sturen':('alle '+lijst.length+' sturen'))+'</button>';
    b.innerHTML=h;
  }
  if(fotoUrls[itemId]){teken(fotoUrls[itemId]);return}
  fotosVan(itemId,function(rijen){
    var lijst=[];
    rijen.forEach(function(r){
      var u='';
      try{u=URL.createObjectURL(r.blob)}catch(e){}
      if(u)lijst.push({id:r.id,url:u,blob:r.blob,size:num(r.size)||0});
    });
    fotoUrls[itemId]=lijst;
    teken(lijst);
  });
}

function vulAlleFotos(lijst){
  lijst.forEach(function(it){vulFotos(it.id)});
}

function fotoUitCache(itemId,fid){
  var l=fotoUrls[itemId]||[], uit=null;
  l.forEach(function(x){if(x.id===fid)uit=x});
  return uit;
}

function openFotoView(itemId,fid){
  var l=fotoUrls[itemId]||[], i=-1;
  l.forEach(function(x,ix){if(x.id===fid)i=ix});
  if(i<0){document.getElementById('foto').innerHTML='';return}
  var f=l[i];
  var h='<div class="fotoview"><button class="sluit" data-act="fotoclose" aria-label="Sluiten">&times;</button>'
   + '<img src="'+f.url+'" alt="">'
   + '<div class="fotobar"><span>'
   + (l.length>1?('<button data-act="fotostep" data-id="'+itemId+'" data-f="'+f.id+'" data-d="-1">&#8249;</button>'
      + '<span class="dim" style="margin:0 8px">'+(i+1)+' / '+l.length+'</span>'
      + '<button data-act="fotostep" data-id="'+itemId+'" data-f="'+f.id+'" data-d="1">&#8250;</button>'):'')
   + '</span><span>'
   + '<button data-act="fotoshare" data-id="'+itemId+'" data-f="'+f.id+'">Sturen</button>'
   + '<button class="danger" data-act="fotodel" data-id="'+itemId+'" data-f="'+f.id+'">Verwijderen</button>'
   + '</span></div></div>';
  document.getElementById('foto').innerHTML=h;
}

/* een naam waar je in een map iets aan hebt:
   iPhone-12-128GB-Youssef-2026-08-20-1.jpg */
function fotoBestandsnaam(itemId,nr){
  var it=null;
  S.items.forEach(function(x){if(x.id===itemId)it=x});
  var stuk=[];
  if(it){
    if(it.brand)stuk.push(it.brand);
    if(it.model)stuk.push(it.model);
    if(it.storage)stuk.push(String(it.storage).replace(/\s+/g,''));
    if(it.customer)stuk.push(it.customer);
    var dt=it.soldAt||it.sentAt||it.boughtAt||'';
    if(dt)stuk.push(dt);
  }
  var basis=stuk.join('-')
    .replace(/[^A-Za-z0-9\u00C0-\u024F-]+/g,'-')
    .replace(/-+/g,'-').replace(/^-+|-+$/g,'');
  if(!basis)basis='foto';
  return basis+'-'+(num(nr)||1)+'.jpg';
}

/* alle foto's uit de lade, met hun naam erbij */
function alleFotos(cb){
  fotoDB(function(db){
    if(!db){cb([]);return}
    try{
      var cur=db.transaction('fotos','readonly').objectStore('fotos').openCursor();
      var uit=[];
      cur.onsuccess=function(e){
        var c=e.target.result;
        if(c){uit.push(c.value);c.continue();return}
        uit.sort(function(a,b){
          if(a.itemId!==b.itemId)return String(a.itemId).localeCompare(String(b.itemId));
          return (a.at||0)-(b.at||0);
        });
        var teller={};
        uit.forEach(function(r){
          teller[r.itemId]=(teller[r.itemId]||0)+1;
          r.naam=fotoBestandsnaam(r.itemId,teller[r.itemId]);
        });
        cb(uit);
      };
      cur.onerror=function(){cb([])};
    }catch(e){cb([])}
  });
}

function fotoAlsFile(blob,naam){
  return new File([blob],naam,{type:(blob&&blob.type)||'image/jpeg'});
}

/* doorgeven aan het deelmenu van de telefoon; daar kies je zelf de map */
function deelFotos(files,klaar){
  try{
    if(files.length&&navigator.canShare&&navigator.canShare({files:files})){
      navigator.share({files:files}).then(function(){klaar('ok')},function(){klaar('afgebroken')});
      return;
    }
  }catch(e){}
  klaar('kan-niet');
}

function kanInMapSchrijven(){
  return !!(window.showDirectoryPicker);
}

function bytesTekst(n){
  n=num(n);
  if(n<1024)return Math.round(n)+' B';
  if(n<1048576)return Math.round(n/1024)+' KB';
  if(n<1073741824)return comma(n/1048576,1)+' MB';
  return comma(n/1073741824,1)+' GB';
}

    h+='<div class="mono dim" style="font-size:14px;margin-top:4px">'+expRijen.length+' '

         + (Math.floor(expIndex/EXP_GROEP)+1)+' van '+groepjes+' sturen ('+nu+' '

      } else {
        h+='<div class="note" style="color:var(--mint)">Alle groepjes zijn doorgegeven.</div>';
      }
      h+='<div class="hint">Je telefoon laat een website niet zelf in een map schrijven. Kies in het '
       + 'deelmenu <b>Opslaan in Bestanden</b> en wijs daar je map aan &mdash; of stuur ze naar Drive, '
       + 'iCloud of naar jezelf via WhatsApp.</div>';
    }

    if(expMelding)h+='<div class="warn" style="border-color:var(--line)">'+esc(expMelding)+'</div>';

    h+='<div class="divider"></div>'
     + '<div class="hint">'+(S.lastFoto
        ? ('Laatste keer geexporteerd: '+dateNL(S.lastFoto)+'.')

/* op een computer: alles in een map die je aanwijst */
function exportNaarMap(){
  if(!kanInMapSchrijven())return;
  var kiezer;
  try{kiezer=window.showDirectoryPicker({mode:'readwrite'})}
  catch(e){expMelding='Deze browser wil geen map geven.';openFotoExport();return}
  kiezer.then(function(dir){
    var i=0, gelukt=0, mis=0;
    function volgende(){
      if(i>=expRijen.length){
        S.lastFoto=today(); save();
        expMelding=gelukt+' '+(gelukt===1?'foto':'foto\'s')+' in de map gezet'
          + (mis?(', '+mis+' niet gelukt'):'')+'.';
        openFotoExport();
        return;
      }
      var r=expRijen[i++];
      expMelding='Bezig: '+i+' van '+expRijen.length+'\u2026';
      var m=document.querySelector('.sheet .warn');
      if(m)m.textContent=expMelding;
      dir.getFileHandle(r.naam,{create:true}).then(function(fh){
        return fh.createWritable();
      }).then(function(w){
        return w.write(r.blob).then(function(){return w.close()});
      }).then(function(){gelukt++;volgende()},function(){mis++;volgende()});
    }
    if(!expMelding){expMelding='Bezig\u2026';openFotoExport()}
    volgende();
  },function(){ /* je hebt het venster gesloten */ });
}

/* op de telefoon: een groepje aan het deelmenu geven */
function deelGroepje(){
  var groep=expRijen.slice(expIndex,expIndex+EXP_GROEP);
  if(!groep.length)return;
  var files=[];
  groep.forEach(function(r){
    try{files.push(fotoAlsFile(r.blob,r.naam))}catch(e){}
  });
  deelFotos(files,function(uitslag){
    if(uitslag==='ok'){
      expIndex+=groep.length;
      S.lastFoto=today(); save();
      expMelding=expIndex>=expRijen.length
        ? 'Klaar. Alle foto\'s zijn doorgegeven.'
        : 'Groepje doorgegeven. Er '+((expRijen.length-expIndex)===1?'is':'zijn')+' nog '
          + (expRijen.length-expIndex)+' over.';
    } else if(uitslag==='kan-niet'){
      expMelding='Deze telefoon kan foto\'s niet doorgeven via het deelmenu. '
        + 'Open de app op een computer in Chrome; daar kan het rechtstreeks naar een map.';
    } else {
      expMelding='Afgebroken, er is niets doorgegeven.';
    }
    openFotoExport();
  });
}

/* ── wat je eerder voor dit model kreeg ── */
function modelHistorie(merk,model,negeerId){
  var m1=String(merk||'').trim().toLowerCase(), m2=String(model||'').trim().toLowerCase();
  if(!m1||!m2)return [];
  var uit=[];
  S.items.forEach(function(x){
    if(!x.sold||x.id===negeerId)return;
    if(String(x.brand||'').trim().toLowerCase()!==m1)return;
    if(String(x.model||'').trim().toLowerCase()!==m2)return;
    if(!(num(x.sell)>0))return;
    uit.push(x);
  });
  uit.sort(function(a,b){return String(b.soldAt||'').localeCompare(String(a.soldAt||''))});
  return uit;
}

function modelHistorieTekst(merk,model,negeerId){
  var l=modelHistorie(merk,model,negeerId);
  if(!l.length)return '';
  var som=0;
  l.forEach(function(x){som+=toMADk(x,x.sell,x.sellCur)});
  var u='Eerder verkocht: '+l.length+(l.length===1?' keer':' keer')+', gemiddeld '+mad(som/l.length);
  var laatste=l[0];
  if(laatste.soldAt)u+='. Laatste op '+dateNL(laatste.soldAt)+' voor '+mad(toMADk(laatste,laatste.sell,laatste.sellCur));
  return u;
}

/* ── zendingen ──
   Een zending is een pakket naar Marokko. De verzendkosten vul je een keer in
   en ze worden gelijk verdeeld over de toestellen die erin zitten. Zodra een
   toestel verkocht of afgeschreven is, wordt zijn deel vastgezet, zodat een
   later toegevoegd toestel de oude winst niet meer verandert. */
function zendingById(zid){
  var z=null;
  (S.zendingen||[]).forEach(function(x){if(x.id===zid)z=x});
  return z;
}
function zendingLeden(zid){
  return S.items.filter(function(x){return x.zid===zid});
}
function zendingKostEUR(z,it){
  if(!z)return 0;
  return (z.costCur==='MAD')?(num(z.cost)/(kr(it)||1)):num(z.cost);
}
/* het deel van de verzendkosten dat bij dit toestel hoort */
function zendingDeelEUR(it){
  if(!it)return 0;
  var vast=num(it.costZ);
  if(vast>0)return vast;
  if(!it.zid)return 0;
  var z=zendingById(it.zid);
  if(!z)return 0;
  var n=zendingLeden(it.zid).length;
  if(n<1)return 0;
  return zendingKostEUR(z,it)/n;
}

/* Vervangen onderdelen staan in een lijst: elk met een naam en een bedrag.
   Toestellen van voor v20 hebben nog een enkel bedrag in costP; die tellen we
   mee zolang er geen lijst is, zodat oude cijfers niet veranderen. */
function onderdelenEUR(it){
  var uit=0;
  if(it&&it.parts&&it.parts.length){
    it.parts.forEach(function(o){uit+=toEURk(it,o.bedrag,o.cur||'EUR')});
    return uit;
  }
  return toEURk(it,it.costP,it.costPCur||'EUR');
}
/* de losse regels voor de kaart: 'accu EUR 25,00 . scherm EUR 60,00' */
function onderdelenDeel(it){
  var uit=[];
  if(it&&it.parts&&it.parts.length){
    it.parts.forEach(function(o){
      var b=toEURk(it,o.bedrag,o.cur||'EUR');
      if(b>0.005||String(o.wat||'').trim())
        uit.push((String(o.wat||'').trim()?esc(o.wat):'onderdeel')+' '+eur(b));
    });
    return uit;
  }
  if(num(it.costP)>0)
    uit.push((it.costWhat?esc(it.costWhat):'onderdelen')+' '+eur(toEURk(it,it.costP,it.costPCur||'EUR')));
  return uit;
}

function kostenEUR(it){return toEURk(it,it.costT,it.costTCur||'EUR')+onderdelenEUR(it)+zendingDeelEUR(it)}

/* prijs die de collega kent; niet ingevuld = jouw echte inkoop */
function doorEUR(it){var v=num(it.told);return v>0?toEURk(it,it.told,it.toldCur||'MAD'):toEURk(it,it.buy,it.buyCur)}

/* wat het toestel jou heeft gekost: inkoop plus transport en onderdelen */
function kostprijsEUR(it){return toEURk(it,it.buy,it.buyCur)+kostenEUR(it)}

/* de twee ondergrenzen bij verkoop: die van jou, en die van het verhaal naar je collega */
function grenzen(it){
  var eigen=kostprijsEUR(it), samen=doorEUR(it);
  return {eigen:eigen, samen:samen};
}

/* hoe lang je geld al in dit toestel zit */
function dagenSinds(sd){
  if(!sd)return -1;
  var d=new Date(sd); if(isNaN(d))return -1;
  return Math.max(0,Math.floor((new Date().setHours(0,0,0,0)-d.setHours(0,0,0,0))/86400000));
}
function dagenTekst(it){
  var n=dagenSinds(it.sent?(it.sentAt||it.boughtAt):it.boughtAt);
  if(n<0)return '';
  if(n===0)return it.sent?'vandaag verstuurd':'vandaag ingekocht';
  return n+' '+(n===1?'dag':'dagen')+' '+(it.sent?'onderweg':'op voorraad');
}

function statusOf(it){
  if(it.off)return 'off';
  if(!it.sold)return it.sent?'sent':'stock';
  var rest=toEURk(it,it.sell,it.sellCur)-paidEUR(it);
  return rest>0.01?'client':'paid';
}
var STATUSLABEL={stock:'Op voorraad',sent:'Verstuurd',client:'Bij klant',paid:'Betaald',off:'Afgeschreven'};

function totals(){
  var t={mijn:0,onze:0,open:0,openMAD:0,invest:0,voorraad:0,verstuurd:0,verkocht:0,bijklant:0,af:0,verloren:0,afOnze:0};
  S.items.forEach(function(it){
    var inkoop=toEURk(it,it.buy,it.buyCur), door=doorEUR(it), kost=kostenEUR(it);
    if(it.off){
      /* afgeschreven: dit geld staat niet meer vast, het is weg. Ook voor je
         collega, want zijn inleg was de doorgegeven prijs. */
      t.af++; t.verloren+=inkoop+kost; t.afOnze+=door;
      t.mijn-=inkoop+kost; t.onze-=door;
      return;
    }
    if(it.sold){
      t.verkocht++;
      var uit=toEURk(it,it.sell,it.sellCur);
      t.mijn+=uit-inkoop-kost; t.onze+=uit-door;
      t.open+=Math.max(0,uit-paidEUR(it));
      t.openMAD+=restMAD(it);
      if(statusOf(it)==='client')t.bijklant++;
    } else {if(it.sent)t.verstuurd++;else t.voorraad++;t.invest+=inkoop+kost;}
  });
  return t;
}

/* ── cijferslot ── */
var pinBuf='', pinMode=null, pinFirst='', locked=false;
function hashPin(p){
  var s='tb9:'+p, x=0x811c9dc5, y=0x1234567;
  for(var i=0;i<s.length;i++){x^=s.charCodeAt(i);x=(x*16777619)>>>0}
  for(var j=s.length-1;j>=0;j--){y^=s.charCodeAt(j);y=(y*31+7)>>>0}
  return x.toString(16)+'-'+y.toString(16);
}
function lockScreen(kop,sub){
  var h='<div class="lockscreen"><div class="lg">'+esc(kop)+'</div><div class="ls">'+esc(sub)+'</div><div class="dots" id="dots">';
  for(var i=0;i<4;i++)h+='<span class="dot'+(i<pinBuf.length?' on':'')+'"></span>';

  [1,2,3,4,5,6,7,8,9].forEach(function(n){h+='<button class="key" data-act="pinkey" data-n="'+n+'">'+n+'</button>'});

function lockSub(){var e=document.querySelector('.lockscreen .ls');return e?e.textContent:''}

function pinDone(){
  if(pinMode===null){
    if(hashPin(pinBuf)===S.pin){document.getElementById('lock').innerHTML='';locked=false;render();}
    else{
      var dots=document.getElementById('dots');
      if(dots)dots.className='dots bad shake';
      setTimeout(function(){pinBuf='';lockScreen('Telefoonboek','Die code klopt niet. Probeer het nog eens.')},450);
    }
  } else if(pinMode==='new'){
    pinFirst=pinBuf;pinBuf='';pinMode='again';lockScreen('Nog een keer','Voer dezelfde code opnieuw in');
  } else if(pinMode==='again'){
    if(pinBuf===pinFirst){S.pin=hashPin(pinBuf);save();pinMode=null;document.getElementById('lock').innerHTML='';render();openSettings();}
    else{pinBuf='';pinMode='new';lockScreen('Niet gelijk','De twee codes waren niet hetzelfde. Kies opnieuw.')}
  } else if(pinMode==='off'){
    if(hashPin(pinBuf)===S.pin){S.pin='';save();pinMode=null;document.getElementById('lock').innerHTML='';render();openSettings();}
    else{pinBuf='';lockScreen('Slot uitzetten','Die code klopt niet. Probeer het nog eens.')}
  }
}

/* wat de toestellen in dit tabblad samen betekenen */
/* de datum waar de ouderdom van een toestel aan hangt: de laatste stap die het
   heeft gezet, zodat 'langst' overal hetzelfde betekent als op de kaart */
function ouderdomsDatum(it){
  if(it.off)return it.offAt||it.boughtAt||'';
  if(it.sold)return it.soldAt||it.boughtAt||'';
  if(it.sent)return it.sentAt||it.boughtAt||'';
  return it.boughtAt||'';
}

/* hoeveel van jouw geld er in dit toestel nog vastzit */
function geldVastEUR(it){
  if(it.off)return 0;
  if(!it.sold)return kostprijsEUR(it);
  return restMAD(it)/(kr(it)||1);
}

/* de drie manieren van sorteren; gelijkspel gaat op nieuwste eerst */
function sorteer(a,b){
  if(ui.sort==='lang'){
    var da=String(ouderdomsDatum(a)||'9999-99-99'), db=String(ouderdomsDatum(b)||'9999-99-99');
    if(da!==db)return da<db?-1:1;
  } else if(ui.sort==='geld'){
    var ga=geldVastEUR(a), gb=geldVastEUR(b);
    if(Math.abs(ga-gb)>0.005)return gb-ga;
  }
  return String(b.createdAt||'').localeCompare(String(a.createdAt||''));
}

/* de knopjes onder de tabbladen */
function sortRow(list){
  if(list.length<3)return '';
  function knop(k,label){
    return '<button class="sortbtn'+(ui.sort===k?' on':'')+'" data-act="sort" data-k="'+k+'">'+label+'</button>';
  }
  return '<div class="sortrow"><span class="k">sorteer</span>'
   + knop('nieuw','nieuwste')+knop('lang','langst')+knop('geld','meeste geld')+'</div>';
}

/* de naam van een maand uit 2026-09 */
function maandNaam(ym){
  if(!/^[0-9]{4}-[0-9]{2}$/.test(String(ym)))return 'zonder datum';
  var d=new Date(Number(String(ym).slice(0,4)),Number(String(ym).slice(5,7))-1,1);
  if(isNaN(d))return String(ym);
  return d.toLocaleDateString('nl-NL',{month:'long',year:'numeric'});
}

/* Je boek staat alleen op deze telefoon. Na een week zonder back-up:
   een strook bovenaan, want in de instellingen kijkt niemand vanzelf. */
function backupWaarschuwing(){
  if(ui.bkOff||!S.items.length)return '';
  var dagen=S.lastBackup?dagenSinds(S.lastBackup):-1;
  if(S.lastBackup&&dagen>=0&&dagen<7)return '';
  var kop=(S.lastBackup&&dagen>=0)
    ? ('Laatste back-up '+dagen+' '+(dagen===1?'dag':'dagen')+' geleden')
    : 'Je hebt nog geen back-up gemaakt';
  return '<div class="warn"><button class="x" data-act="bkoff" aria-label="Sluiten">&times;</button>'

function tabTotaal(list){
  if(!list.length)return '';
  var n=list.length, links=n+' '+(n===1?'toestel':'toestellen'), rechts='';
  if(ui.tab==='client'){
    var open=0;
    list.forEach(function(it){open+=restMAD(it)});
    rechts='nog te krijgen '+mad(open);
  } else if(ui.tab==='paid'){
    var w=0;
    list.forEach(function(it){w+=toEURk(it,it.sell,it.sellCur)-kostprijsEUR(it)});
    rechts=pv('winst '+eur(w));
  } else if(ui.tab==='off'){
    var v=0;
    list.forEach(function(it){v+=kostprijsEUR(it)});
    rechts=pv('verlies '+eur(v));
  } else {
    var inv=0;
    list.forEach(function(it){if(!it.sold&&!it.off)inv+=kostprijsEUR(it)});
    if(inv>0.005)rechts=pv(eur(inv))+' vast';
  }
  return '<div class="meta" style="margin-top:10px"><span>'+links+'</span><span>'+rechts+'</span></div>';
}

function tabBtn(k,label){return '<button class="tab'+(ui.tab===k?' on':'')+'" data-act="tab" data-k="'+k+'">'+label+'</button>'}

function card(it){
  var inkoop=toEURk(it,it.buy,it.buyCur), verkoop=toEURk(it,it.sell,it.sellCur);
  var kost=kostenEUR(it);
  var winst=verkoop-inkoop-kost, betaald=paidEUR(it), rest=Math.max(0,verkoop-betaald);
  var pct=verkoop>0?betaald/verkoop*100:0, klaar=it.sold&&verkoop>0&&rest<0.01;
  var h='<div class="card">';
  h+='<div class="chead"><div><div class="cname">'+esc(it.brand)+' '+esc(it.model)+'</div><div class="cmeta">'
   + [it.storage?esc(it.storage):'',
      num(it.battery)>0?('accu <b style="font-weight:600;color:'+(it.battery>=90?'var(--mint)':(it.battery>=80?'var(--saffron)':'var(--clay)'))+'">'+num(it.battery)+'%</b>'):'',
      it.sold?('verkocht '+dateNL(it.soldAt)):(it.sent?('verstuurd '+dateNL(it.sentAt||it.boughtAt)):('ingekocht '+dateNL(it.boughtAt))),
      (!it.sold&&!it.off)?dagenTekst(it):''].filter(Boolean).join(' &middot; ')
   + '</div></div><button class="pill '+({stock:'stock',sent:'sent',client:'client',paid:'sold',off:'off'})[statusOf(it)]+'" data-act="toggle" data-id="'+it.id+'">'+STATUSLABEL[statusOf(it)]+'</button></div>';

  var door=doorEUR(it), marge=door-inkoop, onze=verkoop-door;
  h+='<div class="row"><span class="dim">Inkoop'+lock()+'</span><span class="r">'+pv(eur(inkoop)+' <span class="dim">&middot; '+mad(inkoop*kr(it))+'</span>')+'</span></div>';
  if(num(it.told)>0){
    h+='<div class="row"><span class="dim">Doorgegeven</span><span class="r">'+mad(door*kr(it))+' <span class="dim">&middot; '+eur(door)+'</span></span></div>';
    if(Math.abs(marge)>0.005)
      h+='<div class="row" style="margin-top:4px"><span class="dim" style="font-size:12px">eigen marge'+lock()+'</span><span class="r dim" style="font-size:12px">'+pv(eur(marge)+' &middot; '+mad(marge*kr(it)))+'</span></div>';
  }
  if(kost>0.005){
    var deel=[];
    if(num(it.costT)>0)deel.push('transport '+eur(toEURk(it,it.costT,it.costTCur||'EUR')));
    onderdelenDeel(it).forEach(function(x){deel.push(x)});
    var zdeel=zendingDeelEUR(it);
    if(zdeel>0.005)deel.push('zending '+eur(zdeel));
    h+='<div class="row"><span class="dim">Kosten'+lock()+'</span><span class="r">'+pv(eur(kost)+' <span class="dim">&middot; '+mad(kost*kr(it))+'</span>')+'</span></div>';
    if(!S.hide)h+='<div class="row" style="margin-top:3px"><span class="dim" style="font-size:12px">'+deel.join(' &middot; ')+'</span><span></span></div>';
  }
  if(!it.sold&&!it.off){
    /* waar de verkoop minimaal op uit moet komen */
    var g=grenzen(it);
    h+='<div class="floor"><div class="row" style="margin-top:0"><span style="font-weight:500">Minimaal'+lock()+'</span>'
     + '<span class="r"><b>'+pv(mad(g.eigen*kr(it)))+'</b>'+(S.hide?'':' <span class="dim">&middot; '+eur(g.eigen)+'</span>')+'</span></div>'
     + '<div class="dim" style="font-size:12px;margin-top:3px">om quitte te staan &mdash; inkoop plus kosten</div>';
    if(g.samen>g.eigen+0.005){
      h+='<div class="row"><span style="font-weight:500;color:var(--azure)">Beter vanaf</span>'
       + '<span class="r"><b style="color:var(--azure)">'+mad(g.samen*kr(it))+'</b> <span class="dim">&middot; '+eur(g.samen)+'</span></span></div>'
       + '<div class="dim" style="font-size:12px;margin-top:3px">dan klopt het ook naar je collega</div>';
    } else if(num(it.told)>0){
      h+='<div class="dim" style="font-size:12px;margin-top:3px">let op: je doorgegeven prijs ligt hieronder</div>';
    }
    var hist=modelHistorieTekst(it.brand,it.model,it.id);
    if(hist)h+='<div class="dim" style="font-size:12px;margin-top:8px;border-top:1px solid var(--line);padding-top:8px">'+hist+'</div>';
    h+='</div>';
  }

  if(it.off){
    var kwijt=kostprijsEUR(it);
    h+='<div class="floor" style="border-color:var(--clay)"><div class="row" style="margin-top:0">'
     + '<span style="font-weight:500;color:var(--clay)">Verloren</span>'
     + '<span class="r"><b style="color:var(--clay)">'+pv('&minus; '+eur(kwijt))+'</b>'+(S.hide?'':' <span class="dim">&middot; '+mad(kwijt*kr(it))+'</span>')+'</span></div>'
     + '<div class="dim" style="font-size:12px;margin-top:3px">'+(it.offWhy?esc(it.offWhy):'afgeschreven')+(it.offAt?(' &middot; '+dateNL(it.offAt)):'')+'</div></div>';
  }

  if(it.sold){
    h+='<div class="row"><span class="dim">Verkoop</span><span class="r">'+eur(verkoop)+' <span class="dim">&middot; '+mad(toMADk(it,it.sell,it.sellCur))+'</span></span></div>';
    if(num(it.rate)>0&&Math.abs(num(it.rate)-S.rate)>0.005)
      h+='<div class="row" style="margin-top:4px"><span class="dim" style="font-size:12px">koers van de verkoopdag</span>'
       + '<span class="r dim" style="font-size:12px">1 &euro; = '+comma(num(it.rate),2)+' DH</span></div>';
    h+='<div class="row win"><span style="font-weight:500">Mijn winst'+lock()+'</span><span class="r"><b style="color:'+(winst>=0?'var(--mint)':'var(--clay)')+'">'
     + pv((winst<0?'&minus; ':'+ ')+eur(Math.abs(winst)))+'</b> <span class="dim">'+(S.hide?'':'&middot; '+mad(Math.abs(winst)*kr(it)))+'</span></span></div>';
    h+='<div class="row"><span style="font-weight:500;color:var(--azure)">Onze winst</span><span class="r"><b style="color:var(--azure)">'
     + mad(onze*kr(it))+'</b> <span class="dim">&middot; '+eur(onze)+'</span></span></div>';

    h+='<div class="box"><div class="row" style="margin-top:0"><span style="font-weight:500">'+(esc(it.customer)||'Klant')+'</span>'
     + '<span class="mono" style="font-size:12px;color:'+(klaar?'var(--mint)':'var(--saffron)')+'">'+(klaar?'volledig betaald':'nog '+mad(restMAD(it)))+'</span></div>';
    h+='<div class="tiles">';
    var filled=Math.max(0,Math.min(10,Math.round(pct/10)));
    for(var i=0;i<10;i++)h+='<span class="tile"'+(i<filled?' style="background:'+(klaar?'var(--mint)':'var(--saffron)')+'"':'')+'></span>';
    h+='</div>';
    h+='<div class="mono dim" style="font-size:12px;margin-top:9px">'+mad(paidMAD(it))+' / '+mad(toMADk(it,it.sell,it.sellCur))+' betaald</div>';
    if((it.payments||[]).length){
      h+='<div class="plist">';
      it.payments.forEach(function(p){
        h+='<div class="pay"><span class="dim">'+dateNL(p.date)+'</span><span><span class="mono">'
         + (p.cur==='MAD'?mad(p.amount):eur(p.amount))+'</span><button class="x" data-act="delpay" data-id="'+it.id+'" data-pid="'+p.id+'" aria-label="Betaling verwijderen">&times;</button></span></div>';
      });
      h+='</div>';
    }
    if(ui.payFor===it.id){
      var pc=ui.payCur||it.sellCur||'MAD';
      h+='<div class="mini"><input id="payinput" inputmode="decimal" placeholder="bedrag" value="'+esc(ui.payVal||'')+'">'
       + '<span class="cur"><button data-act="paycur" data-v="EUR" class="'+(pc==='EUR'?'on':'')+'">&euro;</button>'
       + '<button data-act="paycur" data-v="MAD" class="'+(pc==='MAD'?'on':'')+'">DH</button></span></div>'
       + '<div class="mini"><button class="ok" style="flex:1" data-act="addpay" data-id="'+it.id+'">Zet erbij</button>'
       + '<button class="no" data-act="cancelpay">&times;</button></div>';
    } else if(!klaar){
      h+='<button class="ghost" data-act="pay" data-id="'+it.id+'">Betaling toevoegen</button>';
    }
    h+='</div>';
  }
  if(it.imei)h+='<div class="mono dim" style="font-size:11px;margin-top:12px">IMEI '+esc(it.imei)+'</div>';
  if(it.note)h+='<div class="dim" style="font-size:12px;margin-top:'+(it.imei?'5':'12')+'px">'+esc(it.note)+'</div>';

  h+='<div class="fotorij" id="fr_'+it.id+'"><button class="fotoadd" data-act="fotoadd" data-id="'+it.id+'">+ foto</button></div>';

  h+='<div class="cact">';
  if(it.sold)h+='<button data-act="receipt" data-id="'+it.id+'" style="color:var(--azure)">Bonnetje</button>';
  h+='<button data-act="edit" data-id="'+it.id+'">Bewerken</button>';
  if(ui.confirmDel===it.id){
    h+='<button class="danger" data-act="del" data-id="'+it.id+'">Definitief weg</button><button data-act="undel">Terug</button>';
  } else {
    h+='<button data-act="askdel" data-id="'+it.id+'" aria-label="Verwijderen">'
     + '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#A8998A" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>';
  }
  h+='</div></div>';
  return h;
}

    /* wat dit model je eerder opbracht, meteen bijwerken */
    var ms=document.getElementById('f_model');
    if(ms)ms.addEventListener('change',vulHist);
    ['f_brandFree','f_modelFree'].forEach(function(fid){
      var fe=document.getElementById(fid);
      if(fe)fe.addEventListener('input',vulHist);
    });
    vulHist();
  }

  function vulHist(){
    var doel=document.getElementById('f_hist');
    if(!doel)return;
    var merk=brandSel.value, mdl='';
    if(merk==='Anders'){
      var bf=document.getElementById('f_brandFree'), mf=document.getElementById('f_modelFree');
      merk=bf?bf.value.trim():''; mdl=mf?mf.value.trim():'';
    } else {
      var ms2=document.getElementById('f_model');
      mdl=ms2?ms2.value:'';
    }
    var t2=modelHistorieTekst(merk,mdl,it?it.id:'');
    doel.innerHTML=t2?('<span style="color:var(--azure)">'+t2+'</span>'):'';
  }

  drawType();
  brandSel.addEventListener('change',function(){model='';drawType()});

  /* het formulier rekent met de koers die bij dit toestel hoort: het veld
     'Koers bij verkoop' als dat is ingevuld, anders de koers van nu */
  function koersNu(){
    var f=document.getElementById('f_rate');
    var r=f?num(f.value):0;
    return r>0?r:S.rate;
  }

  function pair(a,b,cur,rev){
    var A=document.getElementById(a),B=document.getElementById(b);
    if(!A||!B)return;
    A.addEventListener('input',function(){
      el.dataset[cur]=rev?'MAD':'EUR';
      var kn=koersNu();
      B.value=A.value===''?'':(rev?comma(num(A.value)/(kn||1),2):String(Math.round(num(A.value)*kn)));
      profit();
    });
  }
  pair('f_buyE','f_buyM','buyCur',false);
  pair('f_buyM','f_buyE','buyCur',true);
  pair('f_selE','f_selM','sellCur',false);
  pair('f_selM','f_selE','sellCur',true);
  pair('f_toldM','f_toldE','toldCur',true);
  pair('f_toldE','f_toldM','toldCur',false);
  ['f_costT','f_rate'].forEach(function(id){
    var f=document.getElementById(id);
    if(f)f.addEventListener('input',profit);
  });

  function profit(){
    var p=document.getElementById('f_profit'); if(!p)return;
    var bE=num((document.getElementById('f_buyE')||{}).value);
    var tE=num((document.getElementById('f_toldE')||{}).value);
    var dE=tE>0?tE:bE;
    var sE=num((document.getElementById('f_selE')||{}).value);
    var kEUR=0;
    var ft=document.getElementById('f_costT');
    if(ft)kEUR+=(el.dataset.costTCur==='MAD'?num(ft.value)/(koersNu()||1):num(ft.value));
    kEUR+=partsEUR(koersNu());
    var m=sE-bE-kEUR, o=sE-dE, kn=koersNu();
    p.innerHTML='<span style="color:'+(m>=0?'var(--mint)':'var(--clay)')+'">mijn winst '+eur(m)+' &middot; '+mad(m*kn)+'</span>'
      + '<br><span style="color:var(--azure)">onze winst '+mad(o*kn)+' &middot; '+eur(o)+'</span>';
    var fl=document.getElementById('f_floor');
    if(fl){
      var eigen=bE+kEUR;
      var u='<span class="dim">minimaal</span> '+mad(eigen*kn)+' <span class="dim">&middot; '+eur(eigen)+'</span>';
      if(dE>eigen+0.005)
        u+='<br><span style="color:var(--azure)">beter vanaf '+mad(dE*kn)+' &middot; '+eur(dE)+'</span>';
      else if(dE>0.005&&num((document.getElementById('f_toldM')||{}).value)>0)
        u+='<br><span class="dim">je doorgegeven prijs ligt hieronder</span>';
      fl.innerHTML=u;
    }
  }
  window.hertelKosten=profit;   /* de onderdelenlijst laat de winst hiermee bijwerken */
  profit();

  tekenParts();

  document.getElementById('f_seg').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b)return;
    setStatusSeg(b.dataset.st);
    profit();
  });
}

/* de lijst met vervangen onderdelen in het formulier */
var formParts=[];

function tekenParts(){
  var box=document.getElementById('partList');
  if(!box)return;
  if(!formParts.length){
    box.innerHTML='<div class="hint" style="margin-top:6px">Niets vervangen. Tik op het plusje als je een '
     + 'accu, scherm of ander onderdeel hebt betaald.</div>';
    return;
  }
  var h='';
  formParts.forEach(function(o,i){
    h+='<div class="partrow">'
     + '<input class="in" data-part="wat" data-i="'+i+'" placeholder="wat is vervangen? bv. accu" value="'+esc(o.wat||'')+'">'
     + '<div class="op">'
     + '<input class="in mono" data-part="bedrag" data-i="'+i+'" inputmode="decimal" placeholder="0,00" value="'+esc(num(o.bedrag)>0?comma(num(o.bedrag),2):'')+'">'
     + '<span class="cur"><button data-act="partcur" data-i="'+i+'" data-v="EUR" class="'+(o.cur!=='MAD'?'on':'')+'">&euro;</button>'
     + '<button data-act="partcur" data-i="'+i+'" data-v="MAD" class="'+(o.cur==='MAD'?'on':'')+'">DH</button></span>'
     + '<button class="weg" data-act="partdel" data-i="'+i+'" aria-label="Weghalen">&times;</button>'
     + '</div></div>';
  });
  box.innerHTML=h;
  /* typen slaat op in de lijst, zonder opnieuw te tekenen: dan blijft je cursor staan */
  [].forEach.call(box.querySelectorAll('[data-part]'),function(f){
    f.addEventListener('input',function(){
      var i=+f.dataset.i;
      if(!formParts[i])return;
      if(f.dataset.part==='wat')formParts[i].wat=f.value;
      else formParts[i].bedrag=num(f.value);
      if(typeof window.hertelKosten==='function')window.hertelKosten();
    });
  });
}

/* wat de onderdelen in het formulier nu samen kosten, in euro */
function partsEUR(koers){
  var uit=0;
  formParts.forEach(function(o){
    uit+=(o.cur==='MAD')?(num(o.bedrag)/(koers||1)):num(o.bedrag);
  });
  return uit;
}

/* zet de drie statusknoppen en de bijbehorende vakken goed */
function setStatusSeg(s){
  var el=document.getElementById('sheet'), seg=document.getElementById('f_seg');
  if(!el||!seg)return;
  el.dataset.st=s;
  var btns=seg.querySelectorAll('button');
  btns[0].className=s==='stock'?'on-stock':'';
  btns[1].className=s==='sent'?'on-sent':'';
  btns[2].className=s==='sold'?'on-sold':'';
  btns[3].className=s==='off'?'on-off':'';
  document.getElementById('sentBox').hidden=s!=='sent';
  document.getElementById('soldBox').hidden=s!=='sold';
  document.getElementById('offBox').hidden=s!=='off';
}

function savePhone(){
  var el=document.getElementById('sheet');
  var brand=document.getElementById('f_brand').value;
  var bFree=document.getElementById('f_brandFree'), mFree=document.getElementById('f_modelFree');
  var mSel=document.getElementById('f_model');
  var finalBrand=brand==='Anders'?((bFree&&bFree.value.trim())||'Anders'):brand;
  var finalModel=brand==='Anders'?(mFree?mFree.value.trim():''):(mSel?mSel.value:'');
  var st=el.dataset.st||'stock';
  var sold=st==='sold', sent=st==='sent', off=st==='off';
  var buyCur=el.dataset.buyCur||'EUR', sellCur=el.dataset.sellCur||'MAD';
  var buy=buyCur==='MAD'?num(document.getElementById('f_buyM').value):num(document.getElementById('f_buyE').value);
  var sell=0;
  if(sold){
    var sm=document.getElementById('f_selM'), se=document.getElementById('f_selE');
    sell=sellCur==='MAD'?num(sm.value):num(se.value);
  }
  var payments=[];
  try{payments=JSON.parse(el.dataset.payments||'[]')}catch(e){}
  if(sold){
    var fp=document.getElementById('f_firstpay');
    if(fp&&num(fp.value)>0)payments=payments.concat([{id:uid(),date:today(),amount:num(fp.value),
      cur:(el.dataset.firstpayCur==='MAD'||el.dataset.firstpayCur==='EUR')?el.dataset.firstpayCur:sellCur}]);
  } else payments=[];

  var toldCur=el.dataset.toldCur||'MAD';
  var tM=document.getElementById('f_toldM'), tE=document.getElementById('f_toldE');
  var told=toldCur==='MAD'?num(tM?tM.value:0):num(tE?tE.value:0);

  var cT=document.getElementById('f_costT');

  var base={
    brand:finalBrand, model:finalModel, told:told, toldCur:toldCur,
    costT:num(cT?cT.value:0), costTCur:el.dataset.costTCur||'EUR',
    parts:(function(){
      var uit=[];
      formParts.forEach(function(o){
        var wat=String(o.wat||'').trim(), bedrag=num(o.bedrag);
        if(!wat&&!(bedrag>0))return;          /* lege regels vallen weg */
        uit.push({id:o.id||uid(),wat:wat,bedrag:bedrag,cur:o.cur==='MAD'?'MAD':'EUR'});
      });
      return uit;
    })(),
    costP:0, costPCur:'EUR', costWhat:'',     /* het oude enkele bedrag is nu een regel in de lijst */
    battery:num((document.getElementById('f_battery')||{}).value),
    imei:((document.getElementById('f_imei')||{}).value||'').trim(),
    phone:(((document.getElementById('f_phone')||{}).value||'').trim()),
    storage:document.getElementById('f_storage').value,
    buy:buy, buyCur:buyCur, sold:sold, sell:sell, sellCur:sellCur,
    customer:sold?(document.getElementById('f_customer').value||'').trim():'',
    payments:payments,
    boughtAt:document.getElementById('f_bought').value,
    sent:sent,
    sentAt:(sent||el.dataset.sentAt)?((document.getElementById('f_sent')||{}).value||''):'',
    off:off,
    offAt:(off||el.dataset.offAt)?((document.getElementById('f_off')||{}).value||''):'',
    offWhy:off?(((document.getElementById('f_offwhy')||{}).value||'').trim()):'',
    rate:(function(){
      /* alleen een afgerond verhaal krijgt een vaste koers: verkocht of afgeschreven */
      if(!sold&&!off)return 0;
      var f=document.getElementById('f_rate');
      if(sold&&f&&num(f.value)>0)return num(f.value);
      var oud=num(el.dataset.rate);
      return oud>0?oud:S.rate;
    })(),
    costZ:(function(){
      /* het deel van de verzendkosten vastzetten zodra het toestel klaar is */
      var oud=num(el.dataset.costZ);
      if(oud>0)return oud;
      if(!sold&&!off)return 0;
      var zid=el.dataset.zid||'';
      var z=zid?zendingById(zid):null;
      if(!z)return 0;
      var n=zendingLeden(zid).length;
      if(n<1)return 0;
      var f2=document.getElementById('f_rate');
      var kNu=(f2&&num(f2.value)>0)?num(f2.value):S.rate;
      var kost=(z.costCur==='MAD')?(num(z.cost)/(kNu||1)):num(z.cost);
      return kost/n;
    })(),
    soldAt:sold?document.getElementById('f_sold').value:'',
    note:(document.getElementById('f_note').value||'').trim()
  };
  var id=el.dataset.id;

  /* Staat deze IMEI al in je boek? Een keer waarschuwen; tik je nog een keer
     op Opslaan, dan gaat het door. Zo boek je hetzelfde toestel niet twee keer. */
  var imeiPlat=String(base.imei||'').replace(/[^0-9]/g,'');
  if(imeiPlat&&el.dataset.imeiOk!=='1'){
    var dub=null;
    S.items.forEach(function(x){
      if(x.id!==id&&String(x.imei||'').replace(/[^0-9]/g,'')===imeiPlat)dub=x;
    });
    if(dub){
      el.dataset.imeiOk='1';
      var w=document.getElementById('f_warn');
      if(w){
        w.innerHTML='<div class="warn">Deze IMEI staat al in je boek bij <b>'+esc(dub.brand+' '+dub.model)+'</b>'
         + (dub.customer?(' van '+esc(dub.customer)):'')+'. '
         + 'Tik nog een keer op Opslaan als dit toch een ander toestel is.</div>';
        w.scrollIntoView();
      }
      return;
    }
  }

  if(id){
    S.items=S.items.map(function(x){return x.id===id?Object.assign({},x,base):x});
  } else {
    base.id=uid(); base.createdAt=new Date().toISOString();
    S.items=[base].concat(S.items);
  }
  save(); closeSheet(); render();
}

/* ── instellingen ── */
/* korte herinnering voor een klant die nog moet betalen; labels uit het bonnetje */
function herinnerTekst(it,lang){
  var B2=BON[lang]||BON.nl, nm=String(it.customer||'').trim();
  var totaal=0, lijst=[];
  S.items.forEach(function(x){
    if(!x.sold)return;
    if(String(x.customer||'').trim().toLowerCase()!==nm.toLowerCase())return;
    var r=restMAD(x);
    if(r>0.5){totaal+=r;lijst.push(x.brand+' '+x.model+(x.storage?' '+x.storage:''))}
  });
  var L=[];
  if(nm)L.push(nm);
  if(lijst.length)L.push(lijst.join(', '));
  L.push(B2.rest+': '+mad(totaal));
  L.push(B2.dank);
  return L.join('\n');
}

/* ── de zendingen zelf ── */
function zNaam(it){return esc(it.brand+' '+it.model+(it.storage?' '+it.storage:''))}

function zHint(z){
  var n=zendingLeden(z.id).length, k=zendingKostEUR(z,null);
  var u='Wordt gelijk verdeeld over de toestellen in deze zending. Nu '
   + n+' '+(n===1?'toestel':'toestellen');
  if(n>0&&k>0.005)u+=' van '+eur(k/n)+' elk';
  return u+'.';
}

function openZendingen(){
  var lijst=(S.zendingen||[]).slice(0).sort(function(a,b){
    return String(b.date||'').localeCompare(String(a.date||''));
  });
  var h='<div class="sheet"><div class="sheet-in"><div class="shead"><button class="back" data-act="close">&#8249;</button>'
   + '<div class="t">Zendingen</div></div>';
  if(!lijst.length){
    h+='<div class="note">Een zending is een pakket naar Marokko. Je vult de verzendkosten een keer in en '
     + 'de app verdeelt ze gelijk over de toestellen die erin zitten. Daarna zet je ze met een tik allemaal '
     + 'op verstuurd.</div>';
  }
  lijst.forEach(function(z){
    var leden=zendingLeden(z.id), n=leden.length, k=zendingKostEUR(z,null);
    var d=[n+' '+(n===1?'toestel':'toestellen')];
    if(n>0&&k>0.005)d.push(eur(k/n)+' per toestel');
