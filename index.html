<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Klusboek</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Klusboek">
<meta name="theme-color" content="#16120F">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  /* zelfde warme leer- en zelligekleuren als het telefoonboek */
  --night:#16120F; --surface:#211B16; --surface2:#2C2419; --line:#3C3227;
  --sand:#F4ECE0; --dim:#A8998A;
  --mint:#4FC08D;      /* binnen, betaald */
  --azure:#D9744C;     /* alle knoppen: terracotta */
  --saffron:#E7AE45;   /* geld dat nog moet komen */
  --clay:#B8483A;      /* weg / fout */
  --teal:#4E9E96;      /* klaar */
  --sky:#6C8FD8;       /* bezig */
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI Variable','Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--night);color:var(--sand);font-family:var(--sans);
  font-size:16px;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{min-height:100vh}
#app{display:flex;flex-direction:column;min-height:100vh}
@supports (min-height:100dvh){#app{min-height:100dvh}}
/* Bedragen blijven van links naar rechts staan, ook als de app in het Arabisch
   staat. Anders schuift het minteken of de munt naar de verkeerde kant. */
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em;
  direction:ltr;unicode-bidi:isolate}
.dim{color:var(--dim)}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--azure);outline-offset:2px}
input,select,textarea{font-family:inherit;font-size:16px}

.wrap{max-width:480px;width:100%;margin:0 auto;padding-bottom:24px;flex:1 0 auto}

/* ── kop ── */
.top{position:sticky;top:0;z-index:20;background:var(--night);padding-top:env(safe-area-inset-top)}
.top-in{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:18px 18px 0}
.title{font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.sub{font-size:12px;color:var(--dim);margin-top:3px;letter-spacing:.02em}
.knoppen{display:flex;gap:7px;flex:0 0 auto}
.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:10px;
  display:flex;align-items:center;justify-content:center}
.icon-btn.on{border-color:var(--saffron);color:var(--saffron)}
.taalbtn{font-size:12px;font-weight:700;padding:10px 11px;min-width:44px}
.zellige{height:8px;margin-top:14px;
  background-image:linear-gradient(45deg,var(--line) 25%,transparent 25%,transparent 75%,var(--line) 75%),
                   linear-gradient(45deg,var(--line) 25%,transparent 25%,transparent 75%,var(--line) 75%);
  background-size:8px 8px;background-position:0 0,4px 4px;opacity:.75}
.pad{padding:0 18px}

/* ── cijfers bovenaan ── */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
/* de cijfers op een rij, zodat het werk hoger op het scherm begint */
.cijfers{display:flex;gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cijfers::-webkit-scrollbar{display:none}
.cijfer{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:9px 13px;text-align:start}
.cijfer .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);white-space:nowrap}
.cijfer .v{font-family:var(--mono);font-size:15px;font-weight:600;margin-top:3px;white-space:nowrap;
  direction:ltr;unicode-bidi:isolate}
.zoekrij{display:flex;gap:8px;align-items:center;margin-top:20px}
.zoekrij .tabs{flex:1;margin:0}
.zoekrij .icon-btn{flex:0 0 auto}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px 14px;
  display:block;width:100%;text-align:start}
.stat .k{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--dim)}
.stat .v{font-family:var(--mono);font-size:20px;font-weight:600;margin-top:8px;letter-spacing:-.03em;
  word-break:break-all;direction:ltr;unicode-bidi:isolate}
.stat .s{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:3px;direction:ltr;unicode-bidi:isolate}

.band{position:relative;overflow:hidden;background:linear-gradient(150deg,var(--surface2),var(--surface));
  border:1px solid var(--saffron);border-radius:18px;padding:13px 15px;margin-top:14px;
  width:100%;text-align:start;display:block}
.band:before{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--saffron)}
.band .k{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--saffron);font-weight:600}
.band .v{font-family:var(--mono);font-size:24px;font-weight:600;margin-top:6px;letter-spacing:-.03em;
  direction:ltr;unicode-bidi:isolate}
.band .s{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.4}
.band .go{width:100%;margin-top:14px;background:var(--azure);color:#1B1108;border-radius:12px;padding:13px;
  font-size:14px;font-weight:700}

/* ── tabbladen ── */
.tabswrap{margin-top:20px}
.tabs{display:flex;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:600;color:var(--dim);
  letter-spacing:-.01em;white-space:nowrap}
.tab.on{background:var(--sand);color:var(--night)}
.search{width:100%;margin-top:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:13px;padding:11px 14px;color:var(--sand);font-size:14px}

/* ── kaarten ── */
.card,.klusrij{-webkit-touch-callout:none}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px;
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset;animation:rise .24s cubic-bezier(.2,.8,.2,1) both;
  width:100%;text-align:start;display:block}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.chead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.cname{font-size:17px;font-weight:650;line-height:1.25;letter-spacing:-.02em}
.cmeta{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.4}
.pill{flex:0 0 auto;border-radius:999px;padding:6px 11px;font-size:11px;font-weight:700;white-space:nowrap;
  letter-spacing:.04em}
/* de stand als knopje: één tik zet hem door naar de volgende stand */
.pill.tik{position:absolute;top:14px;inset-inline-end:14px;z-index:2}
.pill.tik:active{transform:scale(.94)}
.cardvlak{display:block;width:100%;text-align:start;padding:0;background:none;border:0;color:inherit}
.cardvlak .cname{padding-inline-end:96px}
.ministand{border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;letter-spacing:.03em;
  vertical-align:1px;margin-inline-end:4px}
.ministand.todo{border:1px solid var(--line);color:var(--dim)}
.ministand.bezig{background:var(--sky);color:#0B1226}
.ministand.klaar{background:transparent;border:1px solid var(--teal);color:var(--teal)}
.klusrij .mid{flex:1;min-width:0}
.klusrij .nmbtn{display:block;width:100%;text-align:start;padding:0;background:none;border:0;color:inherit}
.pill.todo{background:transparent;color:var(--dim);border:1px solid var(--line)}
.pill.bezig{background:var(--sky);color:#0B1226;border:1px solid var(--sky)}
.pill.klaar{background:transparent;color:var(--teal);border:1px solid var(--teal)}
.pill.betaald{background:var(--mint);color:#0C2119;border:1px solid var(--mint)}
.pill.f-bezig{background:var(--sky);color:#0B1226;border:1px solid var(--sky)}
.pill.f-opgeleverd{background:transparent;color:var(--saffron);border:1px solid var(--saffron)}
.pill.f-factuur{background:var(--saffron);color:#241804;border:1px solid var(--saffron)}
.pill.f-betaald{background:var(--mint);color:#0C2119;border:1px solid var(--mint)}
.seg button.on-f-bezig{background:var(--sky);color:#0B1226}
.seg button.on-f-opgeleverd{background:transparent;border:1px solid var(--saffron);color:var(--saffron)}
.seg button.on-f-factuur{background:var(--saffron);color:#241804}
.seg button.on-f-betaald{background:var(--mint);color:#0C2119}
.seg.four{flex-wrap:wrap}
.seg.four button{flex:1 1 46%;font-size:12.5px;padding:10px 4px}
/* een opdracht als regel onder de klantkaart */
.opdrrij{display:flex;align-items:center;gap:10px;width:100%;text-align:start;
  border-top:1px solid var(--line);padding:12px 0 0;margin-top:12px;background:none;border-left:0;border-right:0;border-bottom:0}
.opdrrij .mid{flex:1;min-width:0}
.opdrrij .nm{font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.opdrrij .sb{font-size:12px;color:var(--dim);margin-top:3px}
.opdrrij .val{flex:0 0 auto;font-family:var(--mono);font-size:13px;white-space:nowrap;
  direction:ltr;unicode-bidi:isolate}
.klusrij.af.aan .vink{background:var(--mint);border-color:var(--mint);color:#0C2119}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:14px;margin-top:9px}
.row .r{font-family:var(--mono);text-align:end;letter-spacing:-.01em;white-space:nowrap;
  direction:ltr;unicode-bidi:isolate}
.row.som{border-top:1px solid var(--line);padding-top:10px;margin-top:11px;font-weight:650}
.row .op{color:var(--saffron);font-weight:700}
.euro{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:26px;
  text-align:center;margin-top:12px}
.empty b{display:block;font-weight:650}
.empty span{display:block;font-size:14px;color:var(--dim);margin-top:7px}
.thumbs{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.thumbs img{width:40px;height:40px;border-radius:9px;object-fit:cover;border:1px solid var(--line)}
.thumbs .n{font-size:11px;color:var(--dim);align-self:center}

/* ── onderbalk ── */
.bar{position:sticky;bottom:0;z-index:30;background:var(--night);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bar-in{max-width:480px;width:100%;margin:0 auto;padding:12px 18px 16px;display:flex;gap:8px}
.primary{flex:1;background:var(--azure);color:#1B1108;border-radius:13px;padding:14px;
  font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.second{flex:0 0 auto;border:1px solid var(--line);color:var(--sand);border-radius:13px;
  padding:14px 16px;font-size:15px;font-weight:600}

/* ── schermen ── */
.sheet{position:fixed;inset:0;z-index:40;background:var(--night);overflow-y:auto;
  display:flex;flex-direction:column}
.sheet-in{max-width:480px;width:100%;margin:0 auto;padding:0 18px 40px;flex:1 0 auto}
.shead{position:sticky;top:0;background:var(--night);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;margin:0 -18px;z-index:5;
  padding:calc(15px + env(safe-area-inset-top)) 18px 15px}
.shead .t{font-size:18px;font-weight:650;letter-spacing:-.02em;flex:1;line-height:1.25}
.back{font-size:24px;line-height:1;padding:2px 8px;flex:0 0 auto}
html[dir="rtl"] .back{transform:scaleX(-1)}
.label{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--dim);margin:22px 0 8px}
.in{width:100%;background:var(--night);border:1px solid var(--line);border-radius:13px;padding:13px;color:var(--sand)}
.in.mono{font-family:var(--mono)}
textarea.in{min-height:76px;line-height:1.5;resize:vertical}
select.in{appearance:none;-webkit-appearance:none;background-image:none}
.selwrap{position:relative}
.selwrap:after{content:'▾';position:absolute;inset-inline-end:13px;top:50%;transform:translateY(-50%);
  color:var(--dim);font-size:12px;pointer-events:none}
.hint{font-size:12px;color:var(--dim);margin-top:7px;line-height:1.5}
.seg{display:flex;gap:4px;background:var(--night);border:1px solid var(--line);border-radius:13px;padding:4px}
.seg button{flex:1;border-radius:10px;padding:11px 4px;font-size:13.5px;font-weight:600;color:var(--dim);white-space:nowrap}
.seg button.on-todo{background:var(--sand);color:var(--night)}
.seg button.on-bezig{background:var(--sky);color:#0B1226}
.seg button.on-klaar{background:var(--teal);color:#08201E}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12.5px;color:var(--dim);font-weight:600}
.chip:active{background:var(--surface2)}
.sbar{position:sticky;bottom:0;background:var(--night);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);z-index:45}
.sbar-in{max-width:480px;width:100%;margin:0 auto;display:flex;gap:8px;padding:12px 18px 16px}
.sbar .cancel{border:1px solid var(--line);color:var(--dim);border-radius:13px;padding:14px 18px;font-size:14px;font-weight:600}
.sbar .save{flex:1;background:var(--azure);color:#1B1108;border-radius:13px;padding:14px;font-size:15px;font-weight:700}
.sbar .keuze{max-width:480px;width:100%;margin:0 auto;padding:11px 18px 0;font-size:13px;color:var(--saffron);
  display:flex;justify-content:space-between;gap:10px;font-weight:600}
.sbar .keuze .b{font-family:var(--mono);direction:ltr;unicode-bidi:isolate}
.outline{width:100%;border:1px solid var(--azure);color:var(--azure);border-radius:13px;padding:12px;
  font-size:14px;font-weight:600;margin-top:10px;background:transparent}
.outline.quiet{border-color:var(--line);color:var(--sand)}
.outline.gevaar{border-color:var(--clay);color:var(--clay)}
.outline.groen{border-color:var(--mint);color:var(--mint)}
.divider{border-top:1px solid var(--line);margin-top:26px}
.note{font-size:12px;color:var(--dim);margin-top:11px;line-height:1.55}
.warn{background:#2E1A14;border:1px solid var(--clay);border-radius:13px;padding:13px;margin-top:12px;
  font-size:14px;line-height:1.5}
.melding{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--saffron);
  border-radius:13px;padding:10px 12px;margin-top:10px;font-size:13px;line-height:1.35}
.melding > div{flex:1;min-width:0}
.melding .doe{flex:0 0 auto;border:1px solid var(--saffron);color:var(--saffron);border-radius:10px;
  padding:7px 11px;font-size:12px;font-weight:600;white-space:nowrap}
.melding .x{flex:0 0 auto;color:var(--dim);padding:0 2px;font-size:18px;line-height:1}

/* ── materiaalregels en bonnetjes ── */
.matrow{background:var(--night);border:1px solid var(--line);border-radius:14px;padding:11px;margin-top:9px}
.matrow .op{display:flex;align-items:center;gap:8px;margin-top:8px}
.matrow .op input{flex:1;min-width:0}
.matrow .weg{flex:0 0 auto;width:38px;height:38px;border:1px solid var(--line);border-radius:10px;
  color:var(--dim);font-size:18px;line-height:1}
.fotorij{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.fototh{width:64px;height:64px;border-radius:12px;overflow:hidden;border:1px solid var(--line);
  padding:0;background:var(--night)}
.fototh img{width:100%;height:100%;object-fit:cover;display:block}
.fotoadd{width:64px;height:64px;border-radius:12px;border:1px dashed var(--line);
  color:var(--dim);font-size:12px;font-weight:600;line-height:1.3}
.matrow .bon{flex:0 0 auto;width:46px;height:46px;border-radius:11px;border:1px dashed var(--line);
  color:var(--dim);font-size:19px;line-height:1;overflow:hidden;padding:0;background:var(--night)}
.matrow .bon img{width:100%;height:100%;object-fit:cover;display:block}
.matrow .bon.heeft{border-style:solid;border-color:var(--mint)}
.matadd{width:100%;margin-top:10px;border:1px dashed var(--line);color:var(--sand);border-radius:12px;
  padding:13px;font-weight:600;font-size:14px}
.cur{display:flex;gap:3px;background:var(--night);border:1px solid var(--line);border-radius:10px;padding:3px;flex:0 0 auto}
.cur button{padding:7px 9px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--dim);font-family:var(--mono)}
.cur button.on{background:var(--sand);color:var(--night)}
.rekening{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:14px}

/* ── lijstregels in de klantkaart ── */
.klusrij{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:start;
  border-bottom:1px solid var(--line);padding:13px 0}
.klusrij .vink{flex:0 0 auto;width:25px;height:25px;border-radius:8px;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:transparent;margin-top:2px}
.klusrij.aan .vink{background:var(--azure);border-color:var(--azure);color:#1B1108}
.matrow .vink{flex:0 0 auto;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:transparent}
.matrow .vink.aan{background:var(--mint);border-color:var(--mint);color:#0C2119}
.klusrij .mid{flex:1;min-width:0}
.klusrij .nm{font-size:14.5px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.klusrij .sb{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.45}
.klusrij .val{flex:0 0 auto;text-align:end;font-family:var(--mono);font-size:14px;white-space:nowrap;
  direction:ltr;unicode-bidi:isolate}
.klusrij .val .s{display:block;font-size:11px;color:var(--dim);margin-top:3px}
.pen{flex:0 0 auto;color:var(--dim);padding:2px 6px;font-size:15px;align-self:center}

/* ── bon groot bekijken ── */
.fotoview{position:fixed;inset:0;z-index:60;background:#0B0908;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.fotoview img{flex:1;min-height:0;width:100%;object-fit:contain}
.fotobar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;font-size:13px}
.fotobar button{padding:9px 12px;border-radius:10px;border:1px solid var(--line);color:var(--sand);
  font-weight:600;font-size:13px;margin-inline-start:7px}
.fotobar .danger{border-color:var(--clay);color:var(--clay)}

.pre{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px;
  font-size:13px;line-height:1.75;white-space:pre-wrap;word-break:break-word;
  max-height:44vh;overflow:auto;margin-top:12px}
.pre.mono{font-family:var(--mono);font-size:12px;direction:ltr}
.ver{font-size:11px;color:var(--dim);text-align:center;margin-top:26px}

/* ── slot ── */
.lockscreen{position:fixed;inset:0;z-index:70;background:var(--night);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:32px 24px calc(32px + env(safe-area-inset-bottom))}
.lockscreen .lg{font-size:26px;font-weight:700;letter-spacing:-.02em}
.lockscreen .ls{font-size:13px;color:var(--dim);margin-top:8px;text-align:center;line-height:1.5}
.dots{display:flex;gap:14px;margin:32px 0 8px;height:16px;align-items:center}
.dot{width:13px;height:13px;border-radius:50%;border:1px solid var(--line);transition:all .15s}
.dot.on{background:var(--azure);border-color:var(--azure);transform:scale(1.1)}
.dots.bad .dot{border-color:var(--clay);background:var(--clay)}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:14px;margin-top:26px;direction:ltr}

/* ── wat er bewaard wordt ── */
var S={rate:10.8, lang:'ar', munt:'MAD', toonEuro:true, tab:'tedoen',
       klanten:[], klussen:[], facturen:[], soorten:[],
       pin:'', hide:false, snaps:[], lastBackup:''};
var ui={lang:'ar', tab:'tedoen', q:'', zoekOpen:false, msg:'', confirm:'',
        gekozen:{}, maand:'', jaar:''};

var omgezet=false;
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){
      var d=JSON.parse(raw);
      if(d.rate)S.rate=d.rate;
      if(d.lang)S.lang=d.lang;
      if(d.munt)S.munt=d.munt;
      if(d.tab==='tedoen'||d.tab==='klanten')ui.tab=d.tab;
      if(typeof d.toonEuro==='boolean')S.toonEuro=d.toonEuro;
      if(Array.isArray(d.klanten))S.klanten=d.klanten;
      if(Array.isArray(d.klussen))S.klussen=d.klussen;
      if(Array.isArray(d.facturen))S.facturen=d.facturen;
      if(Array.isArray(d.soorten))S.soorten=d.soorten;
      if(d.pin)S.pin=d.pin;
      if(d.hide)S.hide=d.hide;
      if(Array.isArray(d.snaps))S.snaps=d.snaps;
      if(d.lastBackup)S.lastBackup=d.lastBackup;
      /* een boek van voor versie 29 komt hier binnen met opdrachten */
      if(Array.isArray(d.opdrachten)&&d.opdrachten.length){uitOpdrachten(d.opdrachten);omgezet=true}
    }
  }catch(e){}
  ui.lang=S.lang;
}

/* Voor elke wijziging de stand van nu bewaren: één per dag, hoogstens vijf. */
function snapshotBij(){
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw)return;
    var d=JSON.parse(raw);
    if(!d||!Array.isArray(d.klussen)||!d.klussen.length)return;
    S.snaps=S.snaps||[];
    var dag=today();
    if(S.snaps.length && S.snaps[0].dag===dag) return;
    S.snaps.unshift({dag:dag, at:Date.now(), n:d.klussen.length, data:backupTekst()});
    S.snaps=S.snaps.slice(0,5);
  }catch(e){}
}

function save(){
  snapshotBij();
  for(var poging=0;poging<4;poging++){
    try{
      localStorage.setItem(KEY,JSON.stringify({v:3,rate:S.rate,lang:ui.lang,munt:S.munt,tab:ui.tab,
        toonEuro:S.toonEuro,klanten:S.klanten,klussen:S.klussen,facturen:S.facturen,
        soorten:S.soorten,pin:S.pin,hide:S.hide,snaps:S.snaps,lastBackup:S.lastBackup}));
      return true;
    }catch(e){
      if(S.snaps&&S.snaps.length){S.snaps.pop();continue;}
      ui.msg=t('opslaanMislukt');
      return false;
    }
  }
  return false;
}

/* ── kleine hulpjes ── */
function uid(){return Math.random().toString(36).slice(2,10)}
function num(v){
  if(typeof v==='number')return isFinite(v)?v:0;
  var n=parseFloat(String(v==null?'':v).replace(/\s/g,'').replace(',','.'));
  return isFinite(n)?n:0;
}
function nf(n,d){return (n||0).toLocaleString('nl-NL',{minimumFractionDigits:d||0,maximumFractionDigits:d||0})}
function dhOnly(n){return nf(Math.round(n||0))+' DH'}
function eu(n){return '€ '+nf(n||0,2)}
/* Binnen in het boek staat alles in dirham; wat je ziet hangt af van de munt. */
function dh(n){return S.munt==='EUR'?eu((n||0)/(S.rate||1)):dhOnly(n)}
function euBij(n){return S.toonEuro?(S.munt==='EUR'?dhOnly(n):eu((n||0)/(S.rate||1))):''}
function toDH(a,cur){return cur==='EUR'?num(a)*(S.rate||1):num(a)}
function uitDH(v){return S.munt==='EUR'?Math.round(v/(S.rate||1)*100)/100:Math.round(v)}
function today(){return new Date().toISOString().slice(0,10)}
function backupNaam(){
  var d=new Date(), tw=function(n){return (n<10?'0':'')+n};
  return 'klusboek-'+today()+'-'+tw(d.getHours())+tw(d.getMinutes())+tw(d.getSeconds())+'.json';
}
function maandVan(s){return String(s||'').slice(0,7)}
function dat(s){
  if(!s)return '';
  var d=new Date(s); if(isNaN(d))return '';
  return d.toLocaleDateString(ui.lang==='ar'?'fr-MA':'nl-NL',{day:'numeric',month:'short',year:'numeric'});
}
function maandNaam(ym){
  var d=new Date(ym+'-01');
  if(isNaN(d))return ym;
  return d.toLocaleDateString(ui.lang==='ar'?'fr-MA':'nl-NL',{month:'long',year:'numeric'});
}
function dagenSinds(datum){
  if(!datum)return 0;
  var d=new Date(datum);
  return isNaN(d)?0:Math.floor((Date.now()-d.getTime())/86400000);
}
function kort(s,n){s=String(s||'');return s.length>n?s.slice(0,n).replace(/\s\S*$/,'')+'…':s}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function pv(s){return S.hide?'••••':s}
var NR=String.fromCharCode(10);

/* ── rekenen ──
   Een klus heeft een bedrag voor je arbeid en bonnetjes voor je materiaal.
   Een factuur bevriest wat je hebt gestuurd, met de betalingen erbij. */
function klusLoon(k){return toDH(k.loon,k.loonCur||'MAD')}
function klusMat(k){var s=0;(k.mats||[]).forEach(function(m){s+=toDH(m.bedrag,m.cur||'MAD')});return s}
function klusTotaal(k){return klusLoon(k)+klusMat(k)}
function isKlaar(k){return (k.status||'todo')==='klaar'}

function klantVan(id){for(var i=0;i<S.klanten.length;i++)if(S.klanten[i].id===id)return S.klanten[i];return null}
function klantNaam(id){var c=klantVan(id);return c?c.naam:'—'}
function klusById(id){for(var i=0;i<S.klussen.length;i++)if(S.klussen[i].id===id)return S.klussen[i];return null}
function factuurById(id){for(var i=0;i<S.facturen.length;i++)if(S.facturen[i].id===id)return S.facturen[i];return null}

function klussenVan(klantId){return S.klussen.filter(function(k){return k.klantId===klantId})}
function teDoenVan(klantId){return klussenVan(klantId).filter(function(k){return !isKlaar(k)})}
function klaarVan(klantId){return klussenVan(klantId).filter(function(k){return isKlaar(k)&&!k.factuurId})}
function facturenVan(klantId){return S.facturen.filter(function(f){return f.klantId===klantId})}

function factuurArbeid(f){var s=0;(f.regels||[]).forEach(function(r){s+=toDH(r.bedrag,r.cur||'MAD')});return s}
function factuurMat(f){return toDH(f.matBedrag,f.matCur||'MAD')}
function factuurTotaal(f){return factuurArbeid(f)+factuurMat(f)}
function factuurBetaald(f){var s=0;(f.bet||[]).forEach(function(b){s+=toDH(b.bedrag,b.cur||'MAD')});return s}
function factuurOpen(f){var v=factuurTotaal(f)-factuurBetaald(f);return v>0.5?v:0}
function factuurLaatst(f){
  var l=f.datum||'';
  (f.bet||[]).forEach(function(b){if((b.datum||'')>l)l=b.datum});
  return l;
}

function opDatum(a,b){return String(b.datum||'').localeCompare(String(a.datum||''))||((b.at||0)-(a.at||0))}
function opOud(a,b){return String(a.datum||'').localeCompare(String(b.datum||''))||((a.at||0)-(b.at||0))}

function soortenLijst(){return (VAAK[ui.lang]||VAAK.nl).concat(S.soorten||[])}

function totalen(){
  var factureren=0, wacht=0, maand=0, planning=0, afgerond=0, voorgeschoten=0, oud=0, nWacht=0;
  var nu=ui.maand||maandVan(today());
  S.klussen.forEach(function(k){
    if(!isKlaar(k)){planning+=klusLoon(k); return}
    if(maandVan(k.klaarOp||'')===nu)afgerond+=klusLoon(k);
    if(!k.factuurId){factureren+=klusTotaal(k); voorgeschoten+=klusMat(k)}
  });
  S.facturen.forEach(function(f){
    var open=factuurOpen(f);
    if(open>0){
      wacht+=open; nWacht++;
      if(dagenSinds(factuurLaatst(f))>30)oud++;
    }
    (f.bet||[]).forEach(function(b){if(maandVan(b.datum)===nu)maand+=toDH(b.bedrag,b.cur||'MAD')});
  });
  return {factureren:factureren, wacht:wacht, maand:maand, planning:planning,
          afgerond:afgerond, voorgeschoten:voorgeschoten, oud:oud, nWacht:nWacht,
          open:factureren+wacht};
}

/* ── een boek van voor versie 29 omzetten ──
   Vroeger hingen klussen aan een opdracht en het geld ook. Nu hangen ze aan de
   klant. Elke opdracht waar geld in omging wordt een factuur met de klussen
   die er klaar in stonden; de rest worden gewone klussen. */
function uitOpdrachten(opdrachten){
  var vanOpdracht={};
  opdrachten.forEach(function(o){vanOpdracht[o.id]=o});
  S.klussen.forEach(function(k){
    var o=vanOpdracht[k.opdrachtId];
    if(o&&!k.klantId)k.klantId=o.klantId;
    delete k.taken;
  });
  opdrachten.forEach(function(o){
    var mijn=S.klussen.filter(function(k){return k.opdrachtId===o.id});
    var af=mijn.filter(isKlaar);
    var bet=(o.bet||[]).filter(function(b){return num(b.bedrag)!==0});
    var eigenMat=0;(o.mats||[]).forEach(function(m){eigenMat+=toDH(m.bedrag,m.cur||'MAD')});
    /* alleen een factuur maken als er geld in omging of als hij verstuurd was */
    var wasFactuur = bet.length>0 || o.fase==='factuur' || o.fase==='betaald';
    if(!wasFactuur||!af.length){
      /* geen factuur: de bonnetjes van de opdracht zelf mogen niet verdwijnen */
      if(eigenMat>0&&mijn.length){
        mijn[0].mats=(mijn[0].mats||[]).concat(o.mats||[]);
      }
      return;
    }
    var f={id:uid(),klantId:o.klantId,datum:o.datum||today(),
           naam:o.naam||'',regels:[],matBedrag:0,matCur:S.munt,bet:bet,at:o.at||Date.now()};
    var matDH=eigenMat;
    af.forEach(function(k){
      f.regels.push({klusId:k.id,titel:k.titel||'',bedrag:num(k.loon),cur:k.loonCur||S.munt});
      matDH+=klusMat(k);
      k.factuurId=f.id;
    });
    f.matBedrag=uitDH(matDH); f.matCur=S.munt;
    S.facturen.push(f);
  });
  S.klussen.forEach(function(k){delete k.opdrachtId});
  return true;
}

/* ══ bonnetjes ══
   Het boek zelf staat in localStorage, en die lade is maar zo'n 5 MB groot:
   daar past geen foto in. De foto's van de bonnetjes gaan daarom in IndexedDB,
   een tweede lade die voor bestanden bedoeld is. Ze worden eerst verkleind.
   Let op: foto's passen niet in het back-upbestand, dat is tekst. */
var FOTO_BREED=1500, FOTO_KWAL=0.7;
var FDB=null, fdbStuk=false, bonDoel='', bonDoelSoort='', bonUrls={};

function fotoDB(cb){
  if(FDB){cb(FDB);return}
  if(fdbStuk||!window.indexedDB){cb(null);return}
  try{
    var req=indexedDB.open('klusboek-bonnen',1);
    req.onupgradeneeded=function(e){
      var db=e.target.result;
      if(!db.objectStoreNames.contains('bonnen'))db.createObjectStore('bonnen',{keyPath:'id'});
    };
    req.onsuccess=function(){FDB=req.result;cb(FDB)};
    req.onerror=function(){fdbStuk=true;cb(null)};
    req.onblocked=function(){fdbStuk=true;cb(null)};
  }catch(e){fdbStuk=true;cb(null)}
}
function bonLees(id,cb){
  fotoDB(function(db){
    if(!db){cb(null);return}
    try{
      var r=db.transaction('bonnen','readonly').objectStore('bonnen').get(id);
      r.onsuccess=function(){cb(r.result||null)};
      r.onerror=function(){cb(null)};
    }catch(e){cb(null)}
  });
}
function bonSchrijf(id,blob,cb){
  fotoDB(function(db){
    if(!db){cb(false);return}
    try{
      var tx=db.transaction('bonnen','readwrite');
      tx.objectStore('bonnen').put({id:id,blob:blob,size:blob.size||0,at:Date.now()});
      tx.oncomplete=function(){cb(true)};
      tx.onerror=function(){cb(false)};
      tx.onabort=function(){cb(false)};
    }catch(e){cb(false)}
  });
}
function bonWis(id,cb){
  fotoDB(function(db){
    if(!db){if(cb)cb();return}
    try{
      var tx=db.transaction('bonnen','readwrite');
      tx.objectStore('bonnen').delete(id);
      tx.oncomplete=function(){if(cb)cb()};
      tx.onerror=function(){if(cb)cb()};
    }catch(e){if(cb)cb()}
  });
}
function bonTotalen(cb){
  fotoDB(function(db){
    if(!db){cb(0,0);return}
    try{
      var cur=db.transaction('bonnen','readonly').objectStore('bonnen').openCursor();
      var n=0,bytes=0;
      cur.onsuccess=function(e){
        var c=e.target.result;
        if(c){n++;bytes+=num(c.value.size)||0;c.continue()} else cb(n,bytes);
      };
      cur.onerror=function(){cb(0,0)};
    }catch(e){cb(0,0)}
  });
}
/* een foto uit de camera is 3 tot 5 MB; verkleind is hij er zo'n 200 KB */
function verklein(file,cb){
  var url='';
  try{
    url=URL.createObjectURL(file);
    var img=new Image();
    img.onload=function(){
      try{
        var w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        var f=Math.min(1,FOTO_BREED/Math.max(w||1,h||1));
        var nw=Math.max(1,Math.round((w||FOTO_BREED)*f)), nh=Math.max(1,Math.round((h||FOTO_BREED)*f));
        var cv=document.createElement('canvas');
        cv.width=nw; cv.height=nh;
        cv.getContext('2d').drawImage(img,0,0,nw,nh);
        URL.revokeObjectURL(url);
        if(cv.toBlob)cv.toBlob(function(bl){cb(bl||file)},'image/jpeg',FOTO_KWAL);
        else cb(file);
      }catch(e){try{URL.revokeObjectURL(url)}catch(e2){} cb(file)}
    };
    img.onerror=function(){try{URL.revokeObjectURL(url)}catch(e2){} cb(file)};
    img.src=url;
  }catch(e){cb(file)}
}
/* een adres naar de foto, zodat we hem in beeld kunnen zetten */
function bonUrl(id,cb){
  if(bonUrls[id]){cb(bonUrls[id]);return}
  bonLees(id,function(r){
    if(!r||!r.blob){cb('');return}
    try{bonUrls[id]=URL.createObjectURL(r.blob);cb(bonUrls[id])}catch(e){cb('')}
  });
}
function bonCacheWeg(id){
  if(bonUrls[id]){try{URL.revokeObjectURL(bonUrls[id])}catch(e){} delete bonUrls[id]}
}
/* de kleine plaatjes invullen nadat het scherm getekend is; de lade antwoordt
   namelijk niet meteen */
function vulBonnen(){
  var lijst=document.querySelectorAll('[data-bon]');
  Array.prototype.forEach.call(lijst,function(el){
    var id=el.getAttribute('data-bon');
    if(el.getAttribute('data-vol')==='1')return;
    bonUrl(id,function(u){
      if(!u)return;
      el.setAttribute('data-vol','1');
      el.classList.add('heeft');
      el.innerHTML='<img src="'+u+'" alt="">';
    });
  });
}

function klantOpslaan(id){
  var naam=document.getElementById('c_naam').value.trim();
  if(!naam){document.getElementById('c_naam').focus();return}
  var c=id?klantVan(id):null;
  if(!c){c={id:uid(),at:Date.now()};S.klanten.push(c)}
  c.naam=naam;
  c.tel=document.getElementById('c_tel').value.trim();

/* ══ een factuur ══
   Een factuur bevriest wat je hebt gestuurd: de klussen met hun bedrag en het
   materiaal bij elkaar. Verandert er later iets aan een klus, dan blijft de
   factuur zoals je hem verstuurde. */
var formBet=[], formFactuurId='';

function maakFactuur(klantId){
  var gek=ui.gekozen[klantId]||{};
  var mee=klaarVan(klantId).filter(function(k){return gek[k.id]}).sort(opOud);
  if(!mee.length){ui.msg=t('nietsGekozen');render();openKlant(klantId,true);return}
  var f={id:uid(),klantId:klantId,datum:today(),naam:'',regels:[],
         matBedrag:0,matCur:S.munt,bet:[],at:Date.now()};
  var matDH=0;
  mee.forEach(function(k){
    f.regels.push({klusId:k.id,titel:k.titel||'',bedrag:num(k.loon),cur:k.loonCur||S.munt});
    matDH+=klusMat(k);
    k.factuurId=f.id;
  });
  f.matBedrag=uitDH(matDH); f.matCur=S.munt;
  S.facturen.push(f);
  ui.gekozen[klantId]={};
  save(); render(); openFactuur(f.id);
}

function openFactuur(fid){
  var f=factuurById(fid);
  if(!f){closeSheet();return}
  formFactuurId=fid;
  formBet=(f.bet||[]).map(function(b){return {id:b.id||uid(),bedrag:b.bedrag,cur:b.cur||'MAD',datum:b.datum}});
  var c=klantVan(f.klantId);

  var h='<div class="sheet"><div class="sheet-in">';
  h+='<div class="shead"><button class="back" data-act="klant" data-id="'+f.klantId+'">‹</button>'
   + '<div class="t">'+esc(t('factuurVan',{d:dat(f.datum)}))+'</div></div>';
  h+='<div class="note">'+esc(c?c.naam:'')+'</div>';

  h+='<div class="rekening">';
  (f.regels||[]).forEach(function(r){
    h+='<div class="row"><span>'+esc(r.titel||t('geenNaam'))+'</span>'
     + '<span class="r">'+pv(dh(toDH(r.bedrag,r.cur||'MAD')))+'</span></div>';
  });
  if(factuurMat(f)>0)h+=bedragRij(t('materialen'),factuurMat(f));
  h+='<div class="row som"><span>'+esc(t('totaal'))+'</span><span class="r">'+pv(dh(factuurTotaal(f)))
   + (S.toonEuro?'<span class="euro">'+pv(euBij(factuurTotaal(f)))+'</span>':'')+'</span></div>';
  h+='<div class="row" id="f_open"></div>';
  h+='</div>';

  h+='<div class="label">'+esc(t('betalingen'))+'</div><div id="f_bet"></div>'
   + '<button class="matadd" data-act="betadd">'+esc(t('betAdd'))+'</button>'
   + '<button class="outline groen" data-act="betrest">'+esc(t('allesBetaald'))+'</button>';

  h+='<div class="divider"></div>';
  h+='<button class="outline" data-act="overzicht" data-id="'+fid+'">'+esc(t('overzicht'))+'</button>';
  h+='<button class="outline quiet" data-act="ovprint" data-id="'+fid+'">'+esc(t('afdrukken'))+'</button>';
  h+='<button class="outline gevaar" data-act="factuurwis" data-id="'+fid+'">'
   + esc(ui.confirm==='fact'+fid?t('wisZeker'):t('factuurWis'))+'</button>';
  h+='<div class="note">'+esc(t('factuurWisUitleg'))+'</div>';
  h+='</div><div class="sbar"><div class="sbar-in">'
   + '<button class="cancel" data-act="klant" data-id="'+f.klantId+'">'+esc(t('annuleer'))+'</button>'
   + '<button class="save" data-act="factuuropslaan" data-id="'+fid+'">'+esc(t('bewaar'))+'</button>'
   + '</div></div></div>';
  document.getElementById('sheet').innerHTML=h;
  terugAan(function(){openKlant(f.klantId)});
  window.scrollTo(0,0);
  tekenBet();
}

function tekenBet(){
  var box=document.getElementById('f_bet');
  if(!box)return;
  var h='';
  formBet.forEach(function(b,i){
    h+='<div class="matrow"><div class="op">'
     + '<input class="in mono" data-bet="bedrag" data-i="'+i+'" inputmode="decimal" placeholder="0" value="'+esc(num(b.bedrag)?String(b.bedrag):'')+'">'
     + curKnop('bet'+i,b.cur||'MAD')
     + '<button class="weg" data-act="betweg" data-i="'+i+'">×</button></div>'
     + '<div class="op"><input class="in mono" data-bet="datum" data-i="'+i+'" type="date" value="'+esc(b.datum||today())+'"></div>'
     + '</div>';
  });
  box.innerHTML=h;
  Array.prototype.forEach.call(box.querySelectorAll('[data-bet]'),function(el){
    el.addEventListener('input',function(){
      var i=+el.getAttribute('data-i');
      formBet[i][el.getAttribute('data-bet')]=el.value;
      tekenOpen();
    });
  });
  tekenOpen();
}
function tekenOpen(){
  var box=document.getElementById('f_open');
  if(!box)return;
  var f=factuurById(formFactuurId);
  if(!f)return;
  var bet=0; formBet.forEach(function(b){bet+=toDH(b.bedrag,b.cur||'MAD')});
  var open=factuurTotaal(f)-bet;
  var kop, waarde, kleur;
  if(open>0.5){kop=t('openstaand'); waarde=open; kleur=''}
  else if(open<-0.5){kop=t('teVeel'); waarde=-open; kleur='color:var(--mint)'}
  else {kop=t('alBetaald'); waarde=bet; kleur='color:var(--mint)'}
  box.innerHTML='<span>'+esc(kop)+'</span>'
   + '<span class="r'+(open>0.5?' op':'')+'" style="'+kleur+'">'+pv(dh(waarde))+'</span>';
}
function factuurOpslaan(fid){
  var f=factuurById(fid);
  if(!f)return;
  f.bet=formBet.filter(function(b){return num(b.bedrag)!==0})
    .map(function(b){return {id:b.id,bedrag:num(b.bedrag),cur:b.cur||'MAD',datum:b.datum||today()}});
  save(); closeSheet(); render(); openKlant(f.klantId);
}
function factuurWissen(fid){
  var f=factuurById(fid);
  if(!f)return;
  var kid=f.klantId;
  S.klussen.forEach(function(k){if(k.factuurId===fid)delete k.factuurId});
  S.facturen=S.facturen.filter(function(x){return x.id!==fid});
  ui.confirm=''; save(); closeSheet(); render(); openKlant(kid);
}

function curKnop(veld,cur){

function formLoonDH(){var el=document.getElementById('k_loon');return toDH(el?el.value:0,formLoonCur)}
function formMatDH(){var s=0;formMats.forEach(function(m){s+=toDH(m.bedrag,m.cur||'MAD')});return s}
function tekenSom(){
  var box=document.getElementById('k_som');
  if(!box)return;
  var loon=formLoonDH(), mat=formMatDH();
  box.innerHTML=bedragRij(t('arbeid'),loon)+bedragRij(t('materialen'),mat)
   + '<div class="row som"><span>'+esc(t('totaal'))+'</span><span class="r">'+dh(loon+mat)
   + (S.toonEuro?'<span class="euro">'+euBij(loon+mat)+'</span>':'')+'</span></div>';

function klusOpslaan(){
  var titel=document.getElementById('k_titel').value.trim();
  if(!titel){document.getElementById('k_titel').focus();return}
  var k=formKlusId?klusById(formKlusId):null;
  if(!k){k={id:uid(),at:Date.now()};S.klussen.push(k)}
  k.klantId=document.getElementById('k_klant').value;
  k.titel=titel;
  k.datum=document.getElementById('k_datum').value||today();
  k.tekst=document.getElementById('k_tekst').value.trim();
  k.status=formStatus;
  if(k.status==='klaar'){if(!k.klaarOp)k.klaarOp=today()} else delete k.klaarOp;

/* ══ achter de cijfers kijken ══ */
function cijferLijst(soort){
  var uit=[], nu=ui.maand||maandVan(today());
  if(soort==='maand'){
    S.facturen.forEach(function(f){
      (f.bet||[]).forEach(function(b){
        if(maandVan(b.datum)!==nu)return;
        var bedrag=toDH(b.bedrag,b.cur||'MAD');
        if(Math.abs(bedrag)<0.5)return;
        uit.push({titel:klantNaam(f.klantId),sub:t('factuurVan',{d:dat(f.datum)})+' · '+dat(b.datum),
                  bedrag:bedrag,soort:'factuur',id:f.id,datum:b.datum});
      });
    });
    uit.sort(function(a,b){return String(b.datum).localeCompare(String(a.datum))});
    return uit;
  }
  if(soort==='factureren'||soort==='open'){
    S.klussen.forEach(function(k){
      if(!isKlaar(k)||k.factuurId)return;
      var bedrag=klusTotaal(k);
      if(bedrag<0.5)return;
      uit.push({titel:k.titel||t('geenNaam'),sub:klantNaam(k.klantId)+' · '+t('nogFactureren'),
                bedrag:bedrag,soort:'klus',id:k.id,datum:k.klaarOp||k.datum});
    });
  }
  if(soort==='wacht'||soort==='open'){
    S.facturen.forEach(function(f){
      var open=factuurOpen(f);
      if(open<0.5)return;
      uit.push({titel:t('factuurVan',{d:dat(f.datum)}),sub:klantNaam(f.klantId)+' · '+t('wachtBetaling'),
                bedrag:open,soort:'factuur',id:f.id,datum:factuurLaatst(f)});
    });
  }
  uit.sort(function(a,b){return String(b.datum||'').localeCompare(String(a.datum||''))});
  return uit;
}
function cijferKop(soort){
  var extra=(ui.maand&&ui.maand!==maandVan(today())&&soort==='maand')?' · '+maandNaam(ui.maand):'';
  return (soort==='maand'?t('dezeMaand'):soort==='factureren'?t('nogFactureren')
        :soort==='wacht'?t('wachtBetaling'):t('nogTeKrijgen'))+extra;

function jaarRijen(jaar){
  var rijen=[];
  for(var m=1;m<=12;m++){

    S.klussen.forEach(function(k){if(maandVan(k.klaarOp||'')===ym)af+=klusLoon(k)});
    S.facturen.forEach(function(f){
      (f.bet||[]).forEach(function(b){if(maandVan(b.datum)===ym)ont+=toDH(b.bedrag,b.cur||'MAD')});
    });
    if(af>0.5||Math.abs(ont)>0.5)rijen.push({ym:ym,af:af,ont:ont});

  else if(s.indexOf('00')===0)s=s.slice(2);

/* ══ cijferslot ══ */
var pinBuf='', pinMode=null, pinFirst='', locked=false;
function hashPin(p){
  var h=5381;
  for(var i=0;i<p.length;i++)h=((h<<5)+h+p.charCodeAt(i))>>>0;
  return String(h);
}
function lockScreen(kop,sub){
  var h='<div class="lockscreen"><div class="lg">'+esc(kop)+'</div><div class="ls">'+esc(sub)+'</div>'
   + '<div class="dots" id="dots">'+[0,1,2,3].map(function(){return '<div class="dot"></div>'}).join('')+'</div>'
   + '<div class="keys">';
  [1,2,3,4,5,6,7,8,9].forEach(function(n){h+='<button class="key" data-act="pin" data-n="'+n+'">'+n+'</button>'});
  h+='<button class="key wide" data-act="pinuit">'+(pinMode?esc(t('annuleer')):'')+'</button>'
   + '<button class="key" data-act="pin" data-n="0">0</button>'
   + '<button class="key wide" data-act="pinweg">←</button>';
  h+='</div></div>';
  document.getElementById('lock').innerHTML=h;
  tekenDots();
}
function tekenDots(){
  var d=document.getElementById('dots');
  if(!d)return;
  Array.prototype.forEach.call(d.children,function(el,i){
    if(i<pinBuf.length)el.classList.add('on'); else el.classList.remove('on');
  });
}
function pinKlaar(){
  var dots=document.getElementById('dots');
  if(pinMode==='nieuw1'){
    pinFirst=pinBuf; pinBuf=''; pinMode='nieuw2';
    lockScreen(t('code'),t('codeHerhaal')); return;
  }
  if(pinMode==='nieuw2'){
    if(pinBuf===pinFirst){
      S.pin=hashPin(pinBuf); save();
      pinBuf='';pinMode=null;document.getElementById('lock').innerHTML='';
      openSettings(); return;
    }
    pinBuf=''; pinMode='nieuw1'; pinFirst='';
    lockScreen(t('code'),t('codeFout')); return;
  }
  if(hashPin(pinBuf)===S.pin){
    locked=false; pinBuf='';
    document.getElementById('lock').innerHTML='';
    render(); return;
  }
  pinBuf='';
  if(dots){dots.classList.add('bad');dots.parentNode.classList.add('shake');
    setTimeout(function(){var d2=document.getElementById('dots');
      if(d2){d2.classList.remove('bad');d2.parentNode.classList.remove('shake');tekenDots()}},420);}
}

  S.klanten=Array.isArray(d.klanten)?d.klanten:[];
  S.klussen=d.klussen;
  S.facturen=Array.isArray(d.facturen)?d.facturen:[];
  if(Array.isArray(d.soorten))S.soorten=d.soorten;
  if(d.rate)S.rate=d.rate;
  if(d.munt)S.munt=d.munt;
  if(typeof d.toonEuro==='boolean')S.toonEuro=d.toonEuro;
  if(d.lang)S.lang=ui.lang=d.lang;
  if(Array.isArray(d.opdrachten)&&d.opdrachten.length)uitOpdrachten(d.opdrachten);
  save(); closeSheet(); render(); controleerBonnen();
}

/* Foto's zitten niet in een back-up. Zet je er een terug, dan staan er vinkjes
   bij bonnetjes die er niet zijn. Bij het opstarten zetten we dat recht. */
function controleerBonnen(){
  var iets=false;
  S.klussen.forEach(function(k){
    (k.mats||[]).forEach(function(m){if(m.foto)iets=true});
    if((k.fotos||[]).length)iets=true;
  });
  if(!iets)return;
  fotoDB(function(db){
    if(!db)return;
    try{
      var cur=db.transaction('bonnen','readonly').objectStore('bonnen').openCursor(), er={};
      cur.onsuccess=function(e){
        var c=e.target.result;
        if(c){er[c.value.id]=1;c.continue();return}
        var veranderd=false;
        S.klussen.forEach(function(k){
          (k.mats||[]).forEach(function(m){if(m.foto&&!er[m.id]){m.foto=false;veranderd=true}});
          if(k.fotos&&k.fotos.length){
            var over=k.fotos.filter(function(f){return er[f.id]});
            if(over.length!==k.fotos.length){k.fotos=over;veranderd=true}
          }
        });
        if(veranderd){save();render()}
      };
      cur.onerror=function(){};
    }catch(e){}
  });
}

/* ══ alle tikken op het scherm ══ */
document.addEventListener('click',function(e){
  var b=e.target.closest('button');
  if(!b)return;
  var act=b.dataset.act;
  if(!act)return;
  var id=b.dataset.id||'';

  if(act==='pin'){
    if(pinBuf.length>=4)return;
    pinBuf+=b.dataset.n; tekenDots();
    if(pinBuf.length===4)setTimeout(pinKlaar,110);
    return;
  }
  if(act==='pinweg'){pinBuf=pinBuf.slice(0,-1);tekenDots();return}
  if(act==='pinuit'){
    if(!pinMode)return;
    pinBuf='';pinMode=null;pinFirst='';
    document.getElementById('lock').innerHTML='';
    openSettings(); return;
  }
  if(locked)return;

  /* ── kop ── */
  if(act==='taal'){ui.lang=ui.lang==='ar'?'nl':'ar';S.lang=ui.lang;save();render();
    if(document.querySelector('.sheet'))closeSheet();return}
  if(act==='taalzet'){ui.lang=b.dataset.v;S.lang=ui.lang;save();render();openSettings();return}
  if(act==='hide'){S.hide=!S.hide;save();render();return}
  if(act==='settings'){openSettings();return}
  if(act==='msgweg'){ui.msg='';render();return}
  if(act==='tab'){ui.tab=b.dataset.k;ui.q='';save();render();return}
  if(act==='zoekaan'){
    ui.zoekOpen=!ui.zoekOpen; if(!ui.zoekOpen)ui.q='';
    render();
    var z=document.getElementById('zoek'); if(z)z.focus();
    return;
  }
  if(act==='cijfer'){ui.maand='';openCijfer(b.dataset.k);return}
  if(act==='jaar'){openJaar(b.dataset.v);return}
  if(act==='maandkijk'){ui.maand=b.dataset.k;openCijfer('maand');return}

  /* ── klanten ── */
  if(act==='klant'){ui.confirm='';openKlant(id);return}
  if(act==='nieuwklant'){openKlantForm('');return}
  if(act==='klantbew'){openKlantForm(id);return}
  if(act==='klantopslaan'){klantOpslaan(id);return}
  if(act==='klantwis'){
    if(ui.confirm!=='klant'+id){ui.confirm='klant'+id;openKlant(id);return}
    klussenVan(id).forEach(function(k){
      (k.mats||[]).forEach(function(m){if(m.foto){bonCacheWeg(m.id);bonWis(m.id)}});
      (k.fotos||[]).forEach(function(f){bonCacheWeg(f.id);bonWis(f.id)});
    });
    S.klussen=S.klussen.filter(function(k){return k.klantId!==id});
    S.facturen=S.facturen.filter(function(f){return f.klantId!==id});
    S.klanten=S.klanten.filter(function(c){return c.id!==id});
    ui.confirm=''; save(); closeSheet(); render(); return;
  }
  if(act==='wa'){
    var c=klantVan(id);
    if(!c||!c.tel){ui.msg=t('geenTel');render();return}
    window.open('https://wa.me/'+waNummer(c.tel),'_blank');
    return;
  }
  if(act==='plakken'){openPlakken(id);return}
  if(act==='plakopslaan'){plakOpslaan(id);return}

  /* ── klussen ── */
  if(act==='klus'){ui.confirm='';openKlusForm(id,'');return}
  if(act==='nieuwklus'){ui.confirm='';openKlusForm('',id);return}
  if(act==='klaartik'){klaarToggle(b.dataset.k,id);return}
  if(act==='vink'){
    ui.gekozen[id]=ui.gekozen[id]||{};
    ui.gekozen[id][b.dataset.k]=!ui.gekozen[id][b.dataset.k];
    openKlant(id,true); return;
  }
  if(act==='chip'){
    var ti=document.getElementById('k_titel');
    if(!ti)return;
    var soort=b.dataset.v, rest=ti.value.replace(/^\s+/,'').replace(/\s+$/,'');
    var bekend=soortenLijst();
    for(var ci=0;ci<bekend.length;ci++){
      var w=bekend[ci];
      if(rest===w||rest.indexOf(w+' ')===0){rest=rest.slice(w.length).replace(/^\s+/,'');break}
    }
    ti.value=rest?(soort+' '+rest):(soort+' ');
    ti.focus();
    try{ti.setSelectionRange(ti.value.length,ti.value.length)}catch(e){}
    return;
  }
  if(act==='soortadd'){
    var doos=document.getElementById('k_soortnieuw');
    if(doos){doos.hidden=false;var inp=document.getElementById('k_soortin');if(inp)inp.focus()}
    return;
  }
  if(act==='soortok'){
    var inp2=document.getElementById('k_soortin');
    var naam=inp2?inp2.value.trim():'';
    if(!naam){if(inp2)inp2.focus();return}
    if(soortenLijst().indexOf(naam)<0){S.soorten.push(naam);save()}
    if(inp2)inp2.value='';
    document.getElementById('k_soortnieuw').hidden=true;
    tekenChips();
    var ti2=document.getElementById('k_titel');
    if(ti2&&!ti2.value.trim())ti2.value=naam;
    return;
  }
  if(act==='soortwis'){
    S.soorten=S.soorten.filter(function(x){return x!==b.dataset.v});
    save(); openSettings(); return;
  }
  if(act==='stand'){
    formStatus=b.dataset.v;
    var seg=document.getElementById('k_seg');
    if(seg)Array.prototype.forEach.call(seg.children,function(el){
      el.className=(el.dataset.v===formStatus?'on-'+el.dataset.v:'');
    });
    return;
  }
  if(act==='cur'){
    var veld=b.dataset.veld, v=b.dataset.v;
    if(veld==='loon')formLoonCur=v;
    else if(veld.indexOf('mat')===0)formMats[+veld.slice(3)].cur=v;
    else if(veld.indexOf('bet')===0)formBet[+veld.slice(3)].cur=v;
    Array.prototype.forEach.call(b.parentNode.children,function(el){
      el.className=(el.dataset.v===v?'on':'');
    });
    if(document.getElementById('k_som'))tekenSom();
    if(document.getElementById('f_open'))tekenOpen();
    return;
  }
  if(act==='klusfoto'){
    if(formFotos.length>=FOTO_MAX_KLUS){ui.msg=t('fotoVol',{n:FOTO_MAX_KLUS});render();return}
    bonDoel=uid()+uid(); bonDoelSoort='klusfoto';
    document.getElementById('bonIn').click();
    return;
  }
  if(act==='matadd'){formMats.push({id:uid()+uid(),naam:'',bedrag:'',cur:S.munt,foto:false});tekenMats();tekenSom();return}
  if(act==='matweg'){
    var mi=+b.dataset.i, mm=formMats[mi];
    if(mm&&mm.foto){bonCacheWeg(mm.id);bonWis(mm.id)}
    formMats.splice(mi,1); tekenMats(); tekenSom(); return;
  }
  if(act==='bonpak'){
    var bi=+b.dataset.i, bm=formMats[bi];
    if(!bm)return;
    if(bm.foto){openBon(bm.id);return}
    bonDoel=bm.id; bonDoelSoort='bon';
    document.getElementById('bonIn').click();
    return;
  }
  if(act==='klusopslaan'){klusOpslaan();return}
  if(act==='formterug'){
    var bewaard={};
    var oud=formKlusId?klusById(formKlusId):null;
    if(oud){
      (oud.mats||[]).forEach(function(m){if(m.foto)bewaard[m.id]=1});
      (oud.fotos||[]).forEach(function(f){bewaard[f.id]=1});
    }
    formNieuweFotos.forEach(function(fid){if(!bewaard[fid]){bonCacheWeg(fid);bonWis(fid)}});
    var terug=oud?oud.klantId:formKlant;
    closeSheet();
    if(terug&&klantVan(terug))openKlant(terug); else render();
    return;
  }
  if(act==='kluskopie'){
    var bron=klusById(id);
    if(!bron)return;
    var kop={id:uid(),klantId:bron.klantId,titel:(bron.titel||'')+' '+t('kopieSuffix'),
      tekst:bron.tekst||'',datum:today(),status:'todo',loon:num(bron.loon),
      loonCur:bron.loonCur||S.munt,mats:[],fotos:[],at:Date.now()};
    S.klussen.push(kop); save(); closeSheet(); render(); openKlusForm(kop.id,'');
    return;
  }
  if(act==='kluswis'){
    if(ui.confirm!=='klus'+id){ui.confirm='klus'+id;openKlusForm(id,'');return}
    var kk=klusById(id);
    if(kk){
      (kk.mats||[]).forEach(function(m){if(m.foto){bonCacheWeg(m.id);bonWis(m.id)}});
      (kk.fotos||[]).forEach(function(f){bonCacheWeg(f.id);bonWis(f.id)});
    }
    var kl=kk?kk.klantId:'';
    S.klussen=S.klussen.filter(function(k){return k.id!==id});
    S.facturen.forEach(function(f){f.regels=(f.regels||[]).filter(function(r){return r.klusId!==id})});
    ui.confirm=''; save(); closeSheet(); render();
    if(kl&&klantVan(kl))openKlant(kl);
    return;
  }

  /* ── facturen ── */
  if(act==='maakfactuur'){maakFactuur(id);return}
  if(act==='factuur'){ui.confirm='';openFactuur(id);return}
  if(act==='factuuropslaan'){factuurOpslaan(id);return}
  if(act==='factuurwis'){
    if(ui.confirm!=='fact'+id){ui.confirm='fact'+id;openFactuur(id);return}
    factuurWissen(id); return;
  }
  if(act==='betadd'){formBet.push({id:uid(),bedrag:'',cur:S.munt,datum:today()});tekenBet();return}
  if(act==='betweg'){formBet.splice(+b.dataset.i,1);tekenBet();return}
  if(act==='betrest'){
    var f2=factuurById(formFactuurId);
    if(!f2)return;
    var al=0; formBet.forEach(function(x){al+=toDH(x.bedrag,x.cur||'MAD')});
    var rest=factuurTotaal(f2)-al;
    if(rest>0.5){formBet.push({id:uid(),bedrag:uitDH(rest),cur:S.munt,datum:today()});tekenBet()}
    return;
  }
  if(act==='overzicht'){openOverzicht(id);return}
  if(act==='ovprint'){drukAf(id);return}
  if(act==='ovwa'){
    var f3=factuurById(id), c3=f3?klantVan(f3.klantId):null;
    var tx=document.getElementById('ov_txt').textContent;
    if(c3&&c3.tel)window.open('https://wa.me/'+waNummer(c3.tel)+'?text='+encodeURIComponent(tx),'_blank');
    return;
  }
  if(act==='ovdeel'){
    var tx2=document.getElementById('ov_txt').textContent;
    if(navigator.share)navigator.share({text:tx2}).catch(function(){});
    else if(navigator.clipboard)navigator.clipboard.writeText(tx2).then(function(){b.textContent=t('gekopieerd')},function(){});
    return;
  }
  if(act==='ovkopie'){
    var tx3=document.getElementById('ov_txt').textContent;
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(tx3).then(function(){b.textContent=t('gekopieerd')},function(){});
    return;
  }

  /* ── bonnetje groot ── */
  if(act==='bonkijk'){openBon(b.dataset.k);return}
  if(act==='bonsluit'){document.getElementById('foto').innerHTML='';return}
  if(act==='bonweg'){
    bonCacheWeg(id); bonWis(id);
    formMats.forEach(function(m){if(m.id===id)m.foto=false});
    formFotos=formFotos.filter(function(f){return f.id!==id});
    document.getElementById('foto').innerHTML='';
    tekenMats(); tekenFotos(); return;
  }
  if(act==='bondeel'){
    bonLees(id,function(r){
      if(!r||!r.blob)return;
      try{
        var fl=new File([r.blob],'bon.jpg',{type:'image/jpeg'});
        if(navigator.canShare&&navigator.canShare({files:[fl]})){navigator.share({files:[fl]}).catch(function(){});return}
      }catch(e){}
      bonUrl(id,function(u){if(u)window.open(u,'_blank')});
    });
    return;
  }

  /* ── instellingen ── */
  if(act==='muntzet'){S.munt=b.dataset.v;save();render();openSettings();return}
  if(act==='euro'){S.toonEuro=!S.toonEuro;save();render();openSettings();return}
  if(act==='bkdeel'){
    S.lastBackup=today(); save();
    var txt=backupTekst();
    try{
      var fl2=new File([txt],backupNaam(),{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[fl2]})){navigator.share({files:[fl2]}).catch(function(){});return}
    }catch(e){}
    if(navigator.share)navigator.share({text:txt}).catch(function(){});
    return;
  }
  if(act==='bkkopie'){
    S.lastBackup=today(); save();
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(backupTekst()).then(function(){b.textContent=t('gekopieerd')},function(){});
    return;
  }
  if(act==='bkfile'){
    S.lastBackup=today(); save();
    var bl=new Blob([backupTekst()],{type:'application/json'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(bl); a.download=backupNaam();
    document.body.appendChild(a); a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);
    return;
  }
  if(act==='pickfile'){document.getElementById('s_file').click();return}
  if(act==='import'){zetTerug(document.getElementById('s_import').value);return}
  if(act==='snap'){var p=(S.snaps||[])[+b.dataset.i];if(p)zetTerug(p.data);return}
  if(act==='pinzet'){
    if(S.pin){S.pin='';save();openSettings();return}
    pinBuf='';pinMode='nieuw1';pinFirst='';
    lockScreen(t('code'),t('codeNieuw'));
    return;
  }
  if(act==='wisalles'){
    if(ui.confirm!=='alles'){ui.confirm='alles';openSettings();return}
    S.klanten=[];S.klussen=[];S.facturen=[];S.snaps=[];
    fotoDB(function(db){
      if(db){try{db.transaction('bonnen','readwrite').objectStore('bonnen').clear()}catch(e){}}
    });
    bonUrls={}; ui.confirm=''; save(); closeSheet(); render(); return;
  }
  if(act==='close'){ui.confirm='';terugUit();closeSheet();render();return}
});

/* een foto kiezen of maken */
(function(){
  var inp=document.getElementById('bonIn');
  if(!inp)return;
  inp.addEventListener('change',function(){
    var f=inp.files&&inp.files[0], doel=bonDoel, soort=bonDoelSoort;
    inp.value='';
    if(!f||!doel)return;
    verklein(f,function(blob){
      bonSchrijf(doel,blob,function(ok){
        if(!ok){ui.msg=t('opslaanMislukt');render();return}
        if(soort==='klusfoto')formFotos.push({id:doel});
        formMats.forEach(function(m){if(m.id===doel)m.foto=true});
        formNieuweFotos.push(doel);
        bonCacheWeg(doel);
        tekenMats(); tekenFotos();
      });
    });
  });
})();

/* een back-upbestand kiezen */
(function(){
  var inp=document.getElementById('s_file');
  if(!inp)return;
  inp.addEventListener('change',function(){
    var f=inp.files&&inp.files[0];
    inp.value='';
    if(!f)return;
    var r=new FileReader();
    r.onload=function(){zetTerug(String(r.result||''))};
    r.readAsText(f);
  });
})();

load();
if(omgezet)save();
controleerBonnen();
if(S.pin){locked=true;render();pinBuf='';pinMode=null;lockScreen(t('app'),t('codeVraag'));}
else render();

/* na drie minuten weg gaat hij weer op slot */
var wegSinds=0;
document.addEventListener('visibilitychange',function(){
  if(!S.pin)return;
  if(document.hidden){wegSinds=Date.now()}
  else if(wegSinds && Date.now()-wegSinds>180000 && !locked){
    locked=true; closeSheet(); render(); pinBuf=''; pinMode=null;
    lockScreen(t('app'),t('codeVraag'));
  }
});

if('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').catch(function(){});
  var verversd=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(verversd)return; verversd=true; location.reload();
  });
}
