    if(wacht>0)d.push('<span style="color:var(--saffron)">'+wacht+' nog niet verstuurd</span>');
    h+='<button class="dl" data-act="zopen" data-z="'+z.id+'">'
     + '<div><div class="nm">'+(z.date?dateNL(z.date):'zonder datum')+'</div>'
     + '<div class="dsub">'+d.join(' &middot; ')+(z.note?('<br>'+esc(z.note)):'')+'</div></div>'
     + '<div class="val"><b>'+pv(eur(k))+'</b><span class="s">'+pv(mad(k*S.rate))+'</span></div></button>';
  });
  h+='<button class="outline" style="margin-top:20px" data-act="znew">+ Nieuwe zending</button>';
  h+='</div><div class="sbar"><div class="sbar-in"><button class="save" data-act="close">Klaar</button></div></div></div>';
  document.getElementById('sheet').innerHTML=h;
}

function openZending(zid){
  var z=zendingById(zid);
  if(!z){openZendingen();return}
  var leden=zendingLeden(zid), n=leden.length, k=zendingKostEUR(z,null);
  var kans=S.items.filter(function(x){return x.zid===zid||(!x.sold&&!x.off)});
  kans.sort(function(a,b){
    var am=a.zid===zid?0:1, bm=b.zid===zid?0:1;
    if(am!==bm)return am-bm;
    return String(b.createdAt||'').localeCompare(String(a.createdAt||''));
  });

  var h='<div class="sheet"><div class="sheet-in"><div class="shead"><button class="back" data-act="zendingen">&#8249;</button>'
   + '<div class="t">Zending</div></div>';

  h+='<div class="label">Verstuurd op</div><input class="in" type="date" id="z_date" value="'+esc(z.date||today())+'">';
  h+='<div class="label">Verzendkosten</div><div class="mini">'
   + '<input class="in mono" id="z_cost" inputmode="decimal" placeholder="0,00" value="'+esc(num(z.cost)>0?comma(num(z.cost),2):'')+'">'
   + '<button class="no" data-act="zcur" data-z="'+zid+'">'+(z.costCur==='MAD'?'DH':'&euro;')+'</button></div>'
   + '<div class="hint" id="z_hint">'+zHint(z)+'</div>';
  h+='<div class="label">Notitie</div><input class="in" id="z_note" placeholder="bv. met de bus, of via mijn broer" value="'+esc(z.note||'')+'">';

  h+='<div class="label">Toestellen in deze zending</div>';
  if(!kans.length){
    h+='<div class="note">Je hebt geen toestellen die je kunt versturen. Voeg eerst een telefoon toe.</div>';
  }
  kans.forEach(function(x){
    var inZ=x.zid===zid;
    var elders=(!inZ&&x.zid)?zendingById(x.zid):null;
    var d=[STATUSLABEL[statusOf(x)]];
    if(elders)d.push('zit in de zending van '+(elders.date?dateNL(elders.date):'zonder datum'));
    h+='<button class="dl" data-act="ztoggle" data-z="'+zid+'" data-id="'+x.id+'">'
     + '<div><div class="nm">'+(inZ?'<span class="tik">&#10003;</span>':'')+zNaam(x)+'</div>'
     + '<div class="dsub">'+d.join(' &middot; ')+'</div></div>'
     + '<div class="val">'+(inZ
        ? ('<b style="color:var(--sky)">'+(n>0&&k>0.005?pv(eur(k/n)):'&mdash;')+'</b>')
        : '<span class="dim" style="font-size:12px">toevoegen</span>')
     + '</div></button>';
  });

  var wacht=leden.filter(function(x){return !x.sold&&!x.off&&!x.sent});
  if(wacht.length)
    h+='<button class="outline" style="margin-top:20px" data-act="zsend" data-z="'+zid+'">Zet '
     + (wacht.length===1?'dit toestel':('deze '+wacht.length+' toestellen'))+' op verstuurd</button>';
  else if(n>0)
    h+='<div class="note">Alle toestellen in deze zending staan al op verstuurd, verkocht of afgeschreven.</div>';

  h+='<div class="divider"></div>'
   + '<button class="outline quiet" data-act="zdel" data-z="'+zid+'">'
   + (ui.zdel===zid?'Zeker? Tik nog een keer om te verwijderen':'Zending verwijderen')+'</button>'
   + '<div class="hint">Je toestellen blijven staan; alleen het pakket en de verdeling van de verzendkosten gaan weg. '
   + 'Bij toestellen die je al verkocht hebt blijft hun deel van de kosten staan.</div>';

  h+='</div><div class="sbar"><div class="sbar-in"><button class="save" data-act="zendingen">Klaar</button></div></div></div>';
  document.getElementById('sheet').innerHTML=h;

  /* meteen opslaan bij typen, zoals de koers in de instellingen */
  var dEl=document.getElementById('z_date');
  if(dEl)dEl.addEventListener('input',function(){z.date=this.value;save();render()});
  var cEl=document.getElementById('z_cost');
  if(cEl)cEl.addEventListener('input',function(){
    z.cost=num(this.value); save();
    var hh=document.getElementById('z_hint'); if(hh)hh.innerHTML=zHint(z);
    render();
  });
  var nEl=document.getElementById('z_note');
  if(nEl)nEl.addEventListener('input',function(){z.note=this.value;save()});
}

/* de tegels aantikken: alles per telefoon eronder */
function openDrill(k){
  var t=totals();
  function naam(it){return esc(it.brand+' '+it.model+(it.storage?' '+it.storage:''))}
  function regel(nm,sub,val,vsub,kleur){
    return '<div class="dl"><div><div class="nm">'+nm+'</div><div class="dsub">'+sub+'</div></div>'
     + '<div class="val"><b'+(kleur?' style="color:'+kleur+'"':'')+'>'+val+'</b>'
     + (vsub?'<span class="s">'+vsub+'</span>':'')+'</div></div>';
  }
  var h='<div class="sheet"><div class="sheet-in"><div class="shead"><button class="back" data-act="close">&#8249;</button>'
   + '<div class="t">'+({invest:'Geïnvesteerd per telefoon',winst:'Winst per telefoon',klanten:'Wie moet nog betalen'}[k]||'Overzicht')+'</div></div>';

  if(k==='invest'){
    var open=S.items.filter(function(x){return !x.sold&&!x.off});
    if(!open.length){
      h+='<div class="note">Je hebt op dit moment niets op voorraad. Alles is verkocht.</div>';
    }
    [['stock','Hier op voorraad'],['sent','Onderweg naar Marokko']].forEach(function(soort){
      var deel=open.filter(function(x){return soort[0]==='sent'?!!x.sent:!x.sent})
        .sort(function(a,b){return kostprijsEUR(b)-kostprijsEUR(a)});
      if(!deel.length)return;
      h+='<div class="label">'+soort[1]+'</div>';
      deel.forEach(function(it){
        var ink=toEURk(it,it.buy,it.buyCur);
        var kt=toEURk(it,it.costT,it.costTCur||'EUR'), kp=onderdelenEUR(it);
        var kz=zendingDeelEUR(it);
        var tot=ink+kt+kp+kz, d=['inkoop '+eur(ink)];
        if(kt>0.005)d.push('transport '+eur(kt));
        onderdelenDeel(it).forEach(function(x){d.push(x)});
        if(kz>0.005)d.push('zending '+eur(kz));
        var dg=dagenTekst(it);
        h+=regel(naam(it), pv(d.join(' &middot; '))+(dg?'<br>'+dg:''), pv(eur(tot)), pv(mad(tot*kr(it))));
      });
      var som=0;
      deel.forEach(function(x){som+=kostprijsEUR(x)});
      h+='<div class="tot"><span>'+deel.length+' '+(deel.length===1?'toestel':'toestellen')+'</span>'
       + '<span class="mono">'+pv(eur(som))+'</span></div>';
    });
    if(open.length){
      h+='<div class="tot eind"><span>Alles bij elkaar</span><span class="mono">'+pv(eur(t.invest))+'</span></div>'
       + '<div class="note">Dit is jouw geld dat nu vastzit: inkoop plus transport en vervangen onderdelen. '
       + 'Zodra je een toestel verkoopt verdwijnt het uit deze lijst.</div>';
    }
  } else if(k==='klanten'){
    var per={}, orde=[];
    S.items.forEach(function(it){
      if(!it.sold)return;
      var nm=String(it.customer||'').trim()||'zonder naam', sl=nm.toLowerCase();
      if(!per[sl]){per[sl]={naam:nm,openMAD:0,aantal:0,openAantal:0,oudste:'',bron:null};orde.push(sl)}
      var r=per[sl];
      r.aantal++;
      var rest=restMAD(it);
      if(rest>0.5){
        r.openMAD+=rest; r.openAantal++;
        if(!r.oudste||String(it.soldAt||'')<r.oudste)r.oudste=String(it.soldAt||'');
        if(!r.bron||(it.phone&&!r.bron.phone))r.bron=it;
      }
    });
    var rijen=[];
    orde.forEach(function(sl){rijen.push(per[sl])});
    var openR=rijen.filter(function(r){return r.openMAD>0.5}).sort(function(a,b){return b.openMAD-a.openMAD});
    var klaarR=rijen.filter(function(r){return r.openMAD<=0.5}).sort(function(a,b){return b.aantal-a.aantal});

    if(!rijen.length) h+='<div class="note">Je hebt nog niets verkocht, dus er zijn nog geen klanten.</div>';

    if(openR.length){
      h+='<div class="label">Moet nog betalen &middot; meeste bovenaan</div>';
      openR.forEach(function(r){
        var d=[r.openAantal+' van '+r.aantal+' '+(r.aantal===1?'toestel':'toestellen')+' open'];
        if(r.oudste){
          var dg=dagenSinds(r.oudste);
          d.push('oudste '+dateNL(r.oudste)+(dg>0?(' &middot; '+dg+' '+(dg===1?'dag':'dagen')):''));
        }
        h+='<div class="dl"><div><div class="nm">'+esc(r.naam)+'</div><div class="dsub">'+d.join('<br>')+'</div></div>'
         + '<div class="val"><b style="color:var(--saffron)">'+mad(r.openMAD)+'</b>'
         + '<span class="s">'+eur(r.openMAD/(S.rate||1))+'</span></div></div>';
        if(r.bron&&r.bron.phone)
          h+='<button class="ghost" data-act="remind" data-id="'+r.bron.id+'">Herinnering naar '+esc(r.naam)+' via WhatsApp</button>';
      });
      var somOpen=0;
      openR.forEach(function(r){somOpen+=r.openMAD});
      h+='<div class="tot"><span>'+openR.length+' '+(openR.length===1?'klant':'klanten')+'</span>'
       + '<span class="mono" style="color:var(--saffron)">'+mad(somOpen)+'</span></div>';
    }
    if(klaarR.length){
      h+='<div class="label">Helemaal betaald</div>';
      klaarR.forEach(function(r){
        h+='<div class="dl"><div><div class="nm">'+esc(r.naam)+'</div>'
         + '<div class="dsub">'+r.aantal+' '+(r.aantal===1?'toestel':'toestellen')+'</div></div>'
         + '<div class="val"><b style="color:var(--mint)">klaar</b></div></div>';
      });
    }
    if(openR.length)
      h+='<div class="note">De herinnering opent WhatsApp met de naam, de toestellen en wat er nog open staat. '
       + 'Je eigen inkoop en je winst staan er niet in.</div>';
  } else {
    var verk=[];
    S.items.forEach(function(it){
      if(it.sold)verk.push({it:it, w:toEURk(it,it.sell,it.sellCur)-kostprijsEUR(it)});
    });
    verk.sort(function(a,b){return b.w-a.w});
    if(!verk.length){
      h+='<div class="note">Je hebt nog niets verkocht, dus er is nog geen winst te zien.</div>';
    } else {
      /* per maand, nieuwste maand bovenaan; alleen als er meer dan een maand is */
      var mnd={}, mo=[];
      verk.forEach(function(r){
        var mk=String(r.it.soldAt||'').slice(0,7)||'onbekend';
        if(!mnd[mk]){mnd[mk]={n:0,w:0};mo.push(mk)}
        mnd[mk].n++; mnd[mk].w+=r.w;
      });
      if(mo.length>1){
        mo.sort(function(a,b){return String(b).localeCompare(String(a))});
        h+='<div class="label">Per maand</div>';
        mo.forEach(function(mk){
          var m2=mnd[mk], goed=m2.w>=0;
          h+='<div class="dl"><div><div class="nm">'+maandNaam(mk)+'</div>'
           + '<div class="dsub">'+m2.n+' verkocht</div></div>'
           + '<div class="val"><b style="color:'+(goed?'var(--mint)':'var(--clay)')+'">'
           + pv((goed?'+ ':'&minus; ')+eur(Math.abs(m2.w)))+'</b></div></div>';
        });
      }
      h+='<div class="label">Verkocht &middot; beste bovenaan</div>';
      verk.forEach(function(r){
        var it=r.it, goed=r.w>=0;
        var d=[it.customer?esc(it.customer):'zonder naam'];
        if(it.soldAt)d.push(dateNL(it.soldAt));
        var rest=Math.max(0,toEURk(it,it.sell,it.sellCur)-paidEUR(it));
        if(rest>0.01)d.push('nog '+mad(restMAD(it)));
        h+=regel(naam(it), d.join(' &middot; '),
          pv((goed?'+ ':'&minus; ')+eur(Math.abs(r.w))), pv(mad(Math.abs(r.w)*kr(r.it))),
          goed?'var(--mint)':'var(--clay)');
      });
      var som=0;
      verk.forEach(function(r){som+=r.w});
      h+='<div class="tot"><span>'+verk.length+' verkocht</span><span class="mono">'+pv(eur(som))+'</span></div>'
       + '<div class="note">Gemiddeld '+pv(eur(som/verk.length))+' per toestel.</div>';
    }
    var afg=S.items.filter(function(x){return x.off});
    if(afg.length){
      h+='<div class="label">Afgeschreven &middot; dit ben je kwijt</div>';
      afg.sort(function(a,b){return kostprijsEUR(b)-kostprijsEUR(a)}).forEach(function(it){
        var d=[];
        if(it.offWhy)d.push(esc(it.offWhy));
        if(it.offAt)d.push(dateNL(it.offAt));
        h+=regel(naam(it), d.join(' &middot; ')||'geen reden ingevuld',
          pv('&minus; '+eur(kostprijsEUR(it))), pv(mad(kostprijsEUR(it)*kr(it))), 'var(--clay)');
      });
      h+='<div class="tot"><span>'+afg.length+' afgeschreven</span>'
       + '<span class="mono" style="color:var(--clay)">'+pv('&minus; '+eur(t.verloren))+'</span></div>';
    }
    if(verk.length||afg.length){
      h+='<div class="tot eind"><span>Jouw winst nu</span><span class="mono">'+pv(eur(t.mijn))+'</span></div>'
       + '<div class="note">Dit is je eigen winst: verkoop min je echte inkoop, min transport en onderdelen, '
       + 'min wat je hebt afgeschreven. Wat je collega ziet staat op het hoofdscherm bij <b>onze winst</b>.</div>';
    }
  }

  h+='</div><div class="sbar"><div class="sbar-in"><button class="save" data-act="close">Klaar</button></div></div></div>';
  document.getElementById('sheet').innerHTML=h;
}

var TXT={
  ar:{afgeschreven:'\u062E\u0633\u0627\u0631\u0629', onderweg:'\u0641\u064A \u0627\u0644\u0637\u0631\u064A\u0642', titel:'دفتر الهواتف', verkocht:'تم البيع', voorraad:'في المخزون',
      inkoop:'الشراء', verkoop:'البيع', winst:'الربح', samen:'الربح المشترك', dh:'درهم'},
  nl:{titel:'Telefoonboek', verkocht:'VERKOCHT', voorraad:'NOG OP VOORRAAD', onderweg:'ONDERWEG NAAR MAROKKO', afgeschreven:'AFGESCHREVEN',
      inkoop:'inkoop', verkoop:'verkoop', winst:'winst', samen:'WINST SAMEN', dh:'DH'}
};
function bedrag(eurBedrag,lang){
  return (eurBedrag*S.rate).toLocaleString('nl-NL',{maximumFractionDigits:0})+' '+TXT[lang].dh;
}
function shareText(lang){
  var T=TXT[lang], t=totals();
  var d=new Date(), dd=('0'+d.getDate()).slice(-2)+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+d.getFullYear();
  var L=[T.titel+' — '+dd];
  var verkocht=S.items.filter(function(x){return x.sold});
  var onderweg=S.items.filter(function(x){return !x.sold&&!x.off&&x.sent});
  var voorraad=S.items.filter(function(x){return !x.sold&&!x.off&&!x.sent});
  var afgeschreven=S.items.filter(function(x){return x.off});
  function naam(it){return it.brand+' '+it.model+(it.storage?' '+it.storage:'')}
  if(verkocht.length){
    L.push('',T.verkocht);
    verkocht.forEach(function(it){
      var dr=doorEUR(it), u=toEURk(it,it.sell,it.sellCur);
      L.push('- '+naam(it));
      L.push('  '+T.inkoop+' '+bedrag(dr,lang)+' | '+T.verkoop+' '+bedrag(u,lang)+' | '+T.winst+' '+bedrag(u-dr,lang));
    });
  }
  if(onderweg.length){
    L.push('',T.onderweg);
    onderweg.forEach(function(it){L.push('- '+naam(it)+' | '+T.inkoop+' '+bedrag(doorEUR(it),lang))});
  }
  if(voorraad.length){
    L.push('',T.voorraad);
    voorraad.forEach(function(it){L.push('- '+naam(it)+' | '+T.inkoop+' '+bedrag(doorEUR(it),lang))});
  }
  if(afgeschreven.length){
    L.push('',T.afgeschreven);
    afgeschreven.forEach(function(it){L.push('- '+naam(it)+' | '+T.inkoop+' '+bedrag(doorEUR(it),lang))});
  }
  L.push('',T.samen+': '+bedrag(t.onze,lang));
  return L.join('\n');
}

/* ── back-up terugzetten, uit een bestand of uit geplakte tekst ── */
function zetTerug(tekst,foutmelding){
  var d;
  try{
    d=JSON.parse(tekst);
    if(!d||!Array.isArray(d.items))throw new Error('bad');
  }catch(e){
    var m=document.getElementById('importMsg');
    if(m)m.textContent=foutmelding;
    return false;
  }
  snapshotBij(true);   /* zodat je een verkeerde terugzetting kunt terugdraaien */
  S.items=d.items;
  if(Array.isArray(d.zendingen))S.zendingen=d.zendingen;
  if(d.rate)S.rate=d.rate;
  if(d.checks)S.checks=d.checks;
  if(d.lang)ui.lang=d.lang;
  save(); render(); openSettings();
  var m2=document.getElementById('importMsg');
  if(m2)m2.textContent=d.items.length+' toestellen teruggezet. Kijk of je winst en je klanten er weer staan.';
  return true;
}

/* ── bonnetje voor de klant ── */
function waNumber(raw){
  var d=String(raw||'').replace(/[^0-9]/g,'');
  if(!d)return '';
  if(d.slice(0,2)==='00')d=d.slice(2);
  if(d.charAt(0)==='0')d='212'+d.slice(1);
  return d;
}
var BON={
  ar:{titel:'وصل', imei:'IMEI', prijs:'الثمن', betaald:'المدفوع', rest:'الباقي', klaar:'تم الدفع بالكامل. شكرا', dank:'شكرا'},
  nl:{titel:'Bonnetje', imei:'IMEI', prijs:'Prijs', betaald:'Betaald', rest:'Nog te betalen', klaar:'Volledig betaald. Bedankt', dank:'Bedankt'}
};
function receiptText(it,lang){
  var B=BON[lang], d=new Date();
  var dd=('0'+d.getDate()).slice(-2)+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+d.getFullYear();
  var prijs=toEURk(it,it.sell,it.sellCur), bet=paidEUR(it), rest=Math.max(0,prijs-bet);
  var L=[B.titel+' — '+dd, it.brand+' '+it.model+(it.storage?' '+it.storage:'')];
  if(it.imei)L.push(B.imei+': '+it.imei);
  L.push(B.prijs+': '+bedrag(prijs,lang));
  L.push(B.betaald+': '+bedrag(bet,lang));
  if(rest>0.01)L.push(B.rest+': '+bedrag(rest,lang)); else L.push(B.klaar);
  return L.join('\n');
}

function backupText(){return JSON.stringify({v:1,rate:S.rate,items:S.items,zendingen:S.zendingen})}

/* Op een iPhone-app werkt opslaan als bestand niet. Delen wel. */
function shareBackup(btn){
  S.lastBackup=today(); save();
  var txt=backupText(), naam='telefoonboek-'+today()+'.json';
  try{
    var f=new File([txt],naam,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      navigator.share({files:[f],title:naam}).catch(function(){});
      return;
    }
  }catch(e){}
  if(navigator.share){navigator.share({text:txt}).catch(function(){});return}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){btn.textContent='Gekopieerd'},function(){showBackup()});
    return;
  }
  showBackup();
}

  S.lastBackup=today(); save();
}

function download(){
  S.lastBackup=today(); save();
  var blob=new Blob([JSON.stringify({v:1,rate:S.rate,items:S.items,zendingen:S.zendingen},null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='telefoonboek-'+today()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
}

  }
  if(act==='askdel'){ui.confirmDel=id;render();return}
  if(act==='undel'){ui.confirmDel=null;render();return}
  if(act==='del'){
    fotosWegVan(id);                 /* de foto's van dit toestel gaan mee */
    fotoCacheWeg(id);
    S.items=S.items.filter(function(x){return x.id!==id});
    ui.confirmDel=null;save();render();return;
  }

  if(act==='fotoadd'){
    fotoDoel=id;
    var fi=document.getElementById('fotoIn');
    if(fi)fi.click();
    return;
  }
  if(act==='fotoview'){openFotoView(id,b.dataset.f);return}
  if(act==='fotoitem'){
    /* alle foto's van dit toestel in een keer doorgeven */
    var l2=fotoUrls[id]||[];
    if(!l2.length)return;
    var fs=[];
    l2.forEach(function(x,ix){
      try{fs.push(fotoAlsFile(x.blob,fotoBestandsnaam(id,ix+1)))}catch(e){}
    });
    deelFotos(fs,function(uitslag){
      if(uitslag==='ok'){S.lastFoto=today();save()}
      else if(uitslag==='kan-niet'){
        ui.msg='Deze telefoon kan foto\'s niet doorgeven via het deelmenu. Op een computer kan het wel, rechtstreeks naar een map.';
        render();
      }
    });
    return;
  }
  if(act==='fotoexport'){expRijen=[];expIndex=0;expMelding='';expBezig=false;openFotoExport();return}
  if(act==='fotomap'){exportNaarMap();return}
  if(act==='fotogroep'){deelGroepje();return}
  if(act==='fotoclose'){document.getElementById('foto').innerHTML='';return}
  if(act==='fotostep'){
    var lst=fotoUrls[id]||[], hier=-1;
    lst.forEach(function(x,ix){if(x.id===b.dataset.f)hier=ix});
    if(hier<0||lst.length<2)return;
    var vlg=(hier+(+b.dataset.d)+lst.length)%lst.length;
    openFotoView(id,lst[vlg].id);
    return;
  }
  if(act==='fotodel'){
    var wg=b.dataset.f;
    fotoWeg(wg,function(){
      fotoCacheWeg(id);
      document.getElementById('foto').innerHTML='';
      render();
      vulFotos(id);
    });
    return;
  }
  if(act==='fotoshare'){
    var ff=fotoUitCache(id,b.dataset.f);
    if(!ff)return;
    var lijstNu=fotoUrls[id]||[], nr=1;
    lijstNu.forEach(function(x,ix){if(x.id===ff.id)nr=ix+1});
    try{
      var fl=fotoAlsFile(ff.blob,fotoBestandsnaam(id,nr));
      if(navigator.canShare&&navigator.canShare({files:[fl]})){
        navigator.share({files:[fl]}).catch(function(){});
        return;
      }
    }catch(e){}
    try{window.open(ff.url,'_blank')}catch(e2){}
    return;
  }
  if(act==='fotokeep'){
    try{
      if(navigator.storage&&navigator.storage.persist){
        navigator.storage.persist().then(function(ok){
          b.textContent=ok?'Je telefoon bewaart deze gegevens'
                          :'Je telefoon beslist dit zelf en kan ze opruimen';
        },function(){b.textContent='Dat lukte niet'});
      } else b.textContent='Deze telefoon kan dat niet';
    }catch(e){b.textContent='Dat lukte niet'}
    return;
  }

  if(act==='copy'){
    S.lastBackup=today(); save();
    var txt=JSON.stringify({v:1,rate:S.rate,items:S.items,zendingen:S.zendingen});
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){b.textContent='Gekopieerd'},function(){b.textContent='Kopiëren lukt niet — gebruik het bestand'});
    } else b.textContent='Kopiëren lukt niet — gebruik het bestand';
    return;
  }
  if(act==='pickfile'){document.getElementById('s_file').click();return}
  if(act==='snapback'){
    var p=(S.snaps||[])[+b.dataset.i];
    if(p) zetTerug(p.data,'Dit herstelpunt is niet leesbaar.');
    return;
  }
  if(act==='import'){
    zetTerug(document.getElementById('s_import').value,
      'Deze tekst is geen geldige back-up. Kopieer hem nog een keer helemaal.');
    return;
  }
});

load();
if(S.pin){locked=true;render();askPin();} else {render();}

/* na een paar minuten weg gaat hij weer op slot */
var wegSinds=0;
document.addEventListener('visibilitychange',function(){
  if(!S.pin)return;
  if(document.hidden){wegSinds=Date.now()}
  else if(wegSinds && Date.now()-wegSinds>180000 && !locked){
    locked=true; closeSheet(); render(); askPin();
  }
});

/* een foto kiezen of maken; verkleinen en dan in de fotolade */
(function(){
  var inp=document.getElementById('fotoIn');
  if(!inp)return;
  inp.addEventListener('change',function(){
    var files=inp.files?Array.prototype.slice.call(inp.files):[];
    var doel=fotoDoel;
    inp.value='';
    if(!doel||!files.length)return;
    fotosVan(doel,function(bestaand){
      var ruimte=FOTO_MAX-bestaand.length;
      if(ruimte<=0){
        ui.msg='Bij een toestel passen maximaal '+FOTO_MAX+' foto\'s. Verwijder er eerst een.';
        render();return;
      }
      var doen=files.slice(0,ruimte), over=files.length-doen.length, klaar=0, mis=0;
      doen.forEach(function(file){
        verkleinFoto(file,function(blob,w,h){
          fotoOpslaan(doel,blob,w,h,function(ok){
            klaar++; if(!ok)mis++;
            if(klaar<doen.length)return;
            if(mis>0)ui.msg='Er '+(mis===1?'is 1 foto':'zijn '+mis+' foto\'s')+' niet opgeslagen. Misschien is je telefoon vol.';
            else if(over>0)ui.msg=over+' '+(over===1?'foto is':'foto\'s zijn')+' niet toegevoegd; er passen maximaal '+FOTO_MAX+' per toestel.';
            fotoCacheWeg(doel);
            render();
            vulFotos(doel);
          });
        });
      });
    });
  });
})();

/* offline houden, alleen als er een service worker mag */
if('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').catch(function(){});
  var verversd=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(verversd)return; verversd=true; location.reload();
  });
}
</script>
