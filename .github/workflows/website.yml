# Zet de website online, maar alleen met de appbestanden.
# Staat er een back-up (.json) in de repo, dan stopt dit meteen,
# komt hij NIET op de website en krijg je een mail van GitHub.
name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Controle - geen back-up of privebestand in de repo
        run: |
          verboden=$(git ls-files | grep -iE '\.(json|csv|xlsx?)$' | grep -v '^manifest\.json$' || true)
          if [ -n "$verboden" ]; then
            echo "::error::PRIVEBESTAND GEVONDEN: $verboden"
            echo "::error::De website is NIET bijgewerkt. Verwijder dit bestand meteen uit de repo."
            exit 1
          fi

      - name: Alleen de appbestanden klaarzetten
        run: |
          mkdir _site
          cp index.html sw.js manifest.json icon-192.png icon-512.png _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
